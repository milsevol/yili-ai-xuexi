<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业微信应用开发 · 交互式演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #16202e;
      --muted: #5f6b7a;
      --line: rgba(22, 32, 46, 0.11);
      --brand: #1d4ed8;
      --brand-soft: rgba(37, 99, 235, 0.1);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
      --c0: #1d4ed8; --c1: #0f766e; --c2: #15803d; --c3: #7c3aed; --c4: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 880px) {
      .app { grid-template-columns: 210px 1fr; align-items: start; }
    }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav {
        flex-direction: column;
        position: sticky; top: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }
    }
    .nav button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.86rem;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      white-space: nowrap;
    }
    @media (min-width: 880px) {
      .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; }
      .nav button:hover { background: #f1f5fb; }
    }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 22px;
      min-height: 440px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 18px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fafcff;
    }
    .card h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .card.click { cursor: pointer; transition: border-color .2s, transform .2s; }
    .card.click:hover { border-color: var(--brand); transform: translateY(-1px); }
    .arch { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; }
    .arch-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .2s, transform .2s;
      background: #fff;
    }
    .arch-item:hover, .arch-item.on { border-color: var(--brand); transform: translateY(-1px); }
    .arch-item strong { display: block; margin-bottom: 4px; }
    .arch-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .detail {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 3.2em;
    }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .chip {
      border: none;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.ghost { background: #eef2f8; color: var(--muted); font-weight: 500; }
    .chip:hover { filter: brightness(0.97); }
    .arrow { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .toolbar .val { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; color: var(--brand); font-weight: 700; min-width: 3.5em; }
    .log {
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #16202e;
      color: #e5eaf1;
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .log .hot { color: #fb923c; }
    .log .ok { color: #86efac; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #f4f6fa;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .bar-row .lbl { width: 90px; color: var(--muted); flex: none; }
    .bar-track { flex: 1; background: #eaeef5; border-radius: 6px; height: 17px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .5s ease; }
    .bar-fill.hot { background: var(--fail); }
    .bar-fill.good { background: var(--ok); }
    .bar-val { width: 80px; flex: none; color: var(--muted); text-align: right; }
    .faq-q {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .faq-q:hover { border-color: var(--brand); }
    .faq-a {
      margin: 4px 0 4px;
      padding: 8px 12px;
      border-left: 3px solid var(--brand);
      background: var(--brand-soft);
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 160px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 120px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; text-align: right; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .kv { font-size: 0.85rem; line-height: 1.85; }
    .kv b { color: var(--brand); font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.75rem; background: #eef2f8; color: var(--muted); }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .pill.bad { background: #fee2e2; color: var(--fail); }
    .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .step-dot {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 0.35rem 0.6rem; font-size: 0.76rem; color: var(--muted);
    }
    .step-dot.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .matrix td, .matrix th { border: 1px solid var(--line); padding: 7px; text-align: center; font-size: 0.8rem; }
    .matrix td { background: #fff; }
    .banner-arrow { display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--brand); font-weight: bold; margin: 0 8px; }
    .chain-box { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; background: #fafcff; text-align: center; font-size: 0.88rem; }
    .flow-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .node-box { border: 1px solid var(--c0); background: var(--brand-soft); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 600; color: var(--brand); cursor: pointer; }
    .node-box:hover { filter: brightness(0.95); }
    .node-box.c1 { border-color: var(--c1); background: rgba(15,118,110,.1); color: var(--c1); }
    .node-box.c2 { border-color: var(--c2); background: rgba(21,128,61,.1); color: var(--c2); }
    .node-box.c3 { border-color: var(--c3); background: rgba(124,58,237,.1); color: var(--c3); }
    .connector { font-size: 1.2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>企微应用开发 交互演示</h1>
        <p>企业微信 · 服务端 API · JS-SDK · 客户联系 · 审批打卡。点章节动手玩。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与定位' },
      { id: '02', title: '02 应用注册与配置' },
      { id: '03', title: '03 消息收发机制' },
      { id: '04', title: '04 客户联系与客户群' },
      { id: '05', title: '05 侧边栏与 JS-SDK' },
      { id: '06', title: '06 审批与打卡集成' },
      { id: '07', title: '07 通讯录与身份验证' },
      { id: '08', title: '08 微应用与小程序' },
      { id: '09', title: '09 企业内部实战案例' },
      { id: '10', title: '10 开发技巧与 FAQ' },
      { id: '11', title: '11 管理后台常见操作' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    function show(id) {
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', `?c=${id}`)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述与定位 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>企业微信 vs 微信 vs 钉钉：三选一？</h2>
        <p class="lead">点击卡片看对比，再点开能力全景卡片了解企业微信开放能力版图。</p>

        <h4>三者定位对比（点卡片看详情）</h4>
        <div class="arch" id="p1a"></div>
        <div class="detail" id="p1aD">点击上方产品卡片。</div>

        <h4>开放能力全景（每块点一下）</h4>
        <div class="arch" id="p1b"></div>
        <div class="detail" id="p1bD">点击上方能力块。</div>
      `
      const comps = [
        ['企业微信', '面向企业内部协同办公 + 对外客户连接。有企业身份体系、应用管理、审批、打卡、客户联系（2亿外部联系人）。与微信互通（互加好友、互通消息）。'],
        ['个人微信', '面向 C 端用户的社交 IM。无企业身份概念、开放平台仅给公众号/小程序能力、不支持审批打卡、不适合内部企业应用集成。'],
        ['钉钉', '阿里系企业 IM + OA。考勤/审批/组织架构强、开放平台偏钉钉生态、与个人微信基本不互通（除部分公告）、外部联系能力弱于企微。'],
      ]
      const a = el.querySelector('#p1a'), aD = el.querySelector('#p1aD')
      comps.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => {
          a.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); aD.innerHTML = `<b>${n}</b>：${d}`
        }
        a.appendChild(div)
      })
      const caps = [
        ['服务端 API', '几乎所有能力都有 REST API：消息推送、审批、打卡、通讯录、客户、群、会议、文档、日程、工单…BaseURL 统一为 https://qyapi.weixin.qq.com/cgi-bin。'],
        ['消息回调', '企业微信在事件发生时 POST 到你配置的回调 URL（Message / Event）。首次验证签名 → 之后是 XML/JSON 消息体。5 秒内必须返回 "success" 表示已收到。'],
        ['JS-SDK（H5）', '在企微内置浏览器里，wx.config 注入权限后可调用拍照、扫码、定位、选人、上传、预览、共享屏幕等原生能力。'],
        ['客户联系（CRM）', '企业成员可添加外部微信用户为「客户」，有客户画像、标签、继承、群聊（客户群）、群聊欢迎语/入群方式。'],
        ['应用与授权', '自建应用（微应用）→ 成员授权可见。第三方应用 → 企微管理员一键授权全企业可见。每个应用有独立 AgentID + Secret。'],
        ['第三方代开发', 'ISV 做第三方应用（type=thirdparty），可代 1000+ 企业部署，通过 suite_access_token + 企业永久授权码管理多租户。'],
      ]
      const b = el.querySelector('#p1b'), bD = el.querySelector('#p1bD')
      caps.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => {
          b.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); bD.innerHTML = `<b>${n}</b>：${d}`
        }
        b.appendChild(div)
      })
    }

    /* ============ 02 应用注册与配置 ============ */
    function render02(el) {
      el.innerHTML = `
        <h2>CorpID / AgentID / Secret 三要素</h2>
        <p class="lead">企微应用鉴权全靠这三要素拉 access_token。点卡片看每个值在哪找、能做什么。</p>

        <h4>三要素交互式展示</h4>
        <div class="arch" id="p2a"></div>
        <div class="detail" id="p2aD">点击上方要素卡片。</div>

        <h4>access_token 获取频率计算器</h4>
        <p class="hint">企微限制：每个应用 <b>每天调用获取 token 接口不超过 2000 次</b>，token 本身有效期 7200 秒（约 2 小时）。</p>
        <div class="slider-row"><span class="name">应用数量</span><input type="range" id="p2apps" min="1" max="30" value="5"><span class="val" id="p2appsV">5 个</span></div>
        <div class="slider-row"><span class="name">每应用刷新频率（次/天）</span><input type="range" id="p2freq" min="1" max="48" value="4"><span class="val" id="p2freqV">4 次/天</span></div>
        <div class="kv" id="p2out"></div>
        <div class="verdict ok" id="p2ver">拖动滑块看 verdict。</div>
      `
      const items = [
        ['CorpID', '企业唯一标识。在「企微管理后台 → 我的企业」看，形如 <code>ww1234567890abcdef</code>。所有 API 都要传。'],
        ['AgentID', '应用 ID。创建应用时分配，1000000 起的整数。API 推送消息时指定推给哪个应用。'],
        ['Secret', '应用密钥，服务端存储，绝不能放前端。用于换取 access_token，泄露会导致别人代你发消息、改通讯录。'],
      ]
      const a = el.querySelector('#p2a'), aD = el.querySelector('#p2aD')
      items.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 20)}…</span>`
        div.onclick = () => {
          a.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); aD.innerHTML = `<b>${n}</b>：${d}`
        }
        a.appendChild(div)
      })

      const apps = el.querySelector('#p2apps'), freq = el.querySelector('#p2freq')
      const appsV = el.querySelector('#p2appsV'), freqV = el.querySelector('#p2freqV')
      const out = el.querySelector('#p2out'), ver = el.querySelector('#p2ver')
      function calc() {
        const A = +apps.value, F = +freq.value
        appsV.textContent = A + ' 个'
        freqV.textContent = F + ' 次/天'
        const total = A * F
        const max = 2000
        out.innerHTML = `总调用 = <b>${A}</b> × <b>${F}</b> = <b>${total}</b> 次/天 / 上限 ${max}`
        const perAppBestPractice = Math.ceil(86400 / 7200) // 2 小时一次 = 12 次/天
        if (total > max) {
          ver.className = 'verdict bad'
          ver.innerHTML = `❌ 超限！${total} > ${max}。建议：<br>① token 缓存到 Redis 按 expires_in 提前 5 分钟刷新；<br>② 多应用共享 token 缓存策略（注意 Secret 不同 → token 不共享，每应用单独缓存）。`
        } else if (F > 12) {
          ver.className = 'verdict warn'
          ver.innerHTML = `⚠️ 每应用建议 ≤ 12 次/天（token 2 小时刷一次足够）。当前每应用 ${F} 次/天 → 疑似每次请求都刷 token。请引入 Redis 缓存。`
        } else {
          ver.className = 'verdict ok'
          ver.innerHTML = `✅ 安全。${total} 次/天，预留了大量余地。最佳实践：Redis 缓存 access_token + 过期时间前 5 分钟刷新。`
        }
      }
      apps.oninput = calc; freq.oninput = calc; calc()
    }

    /* ============ 03 消息收发机制 ============ */
    function render03(el) {
      el.innerHTML = `
        <h2>消息收发：回调 + 主动推送</h2>
        <p class="lead">先看 Webhook 消息的 9 步处理流程，再用模拟器试推送。</p>

        <h4>回调消息处理流程（步进）</h4>
        <div class="toolbar">
          <button class="primary" id="p3next">下一步</button>
          <button id="p3reset">重置</button>
          <span class="pill" id="p3phase">未开始</span>
        </div>
        <div class="steps" id="p3steps"></div>
        <div class="log" id="p3log">点击「下一步」开始。</div>

        <h4>应用消息发送模拟器（频控检查）</h4>
        <div class="slider-row"><span class="name">每次推送条数</span><input type="range" id="p3push" min="1" max="5000" value="1000" step="100"><span class="val" id="p3pushV">1000 条</span></div>
        <div class="slider-row"><span class="name">每人每天接收上限</span><input type="range" id="p3per" min="1" max="50" value="20"><span class="val" id="p3perV">20 条/人/天</span></div>
        <div class="slider-row"><span class="name">目标员工数</span><input type="range" id="p3emp" min="10" max="10000" value="2000" step="100"><span class="val" id="p3empV">2000 人</span></div>
        <div class="verdict ok" id="p3ver">拖动滑块看频控 verdict。</div>
