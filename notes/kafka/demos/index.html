<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apache Kafka · 交互式演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #16202e;
      --muted: #5f6b7a;
      --line: rgba(22, 32, 46, 0.11);
      --brand: #1d4ed8;
      --brand-soft: rgba(37, 99, 235, 0.1);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
      --c0: #1d4ed8; --c1: #0f766e; --c2: #15803d; --c3: #7c3aed; --c4: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 880px) {
      .app { grid-template-columns: 210px 1fr; align-items: start; }
    }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav {
        flex-direction: column;
        position: sticky; top: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }
    }
    .nav button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.86rem;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      white-space: nowrap;
    }
    @media (min-width: 880px) {
      .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; }
      .nav button:hover { background: #f1f5fb; }
    }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 22px;
      min-height: 440px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 18px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fafcff;
    }
    .card h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .card.click { cursor: pointer; transition: border-color .2s, transform .2s; }
    .card.click:hover { border-color: var(--brand); transform: translateY(-1px); }
    .arch { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; }
    .arch-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .2s, transform .2s;
      background: #fff;
    }
    .arch-item:hover, .arch-item.on { border-color: var(--brand); transform: translateY(-1px); }
    .arch-item strong { display: block; margin-bottom: 4px; }
    .arch-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .detail {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 3.2em;
    }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .chip {
      border: none;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.ghost { background: #eef2f8; color: var(--muted); font-weight: 500; }
    .chip:hover { filter: brightness(0.97); }
    .arrow { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .toolbar .val { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; color: var(--brand); font-weight: 700; min-width: 3.5em; }
    .log {
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #16202e;
      color: #e5eaf1;
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .log .hot { color: #fb923c; }
    .log .ok { color: #86efac; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #f4f6fa;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .bar-row .lbl { width: 90px; color: var(--muted); flex: none; }
    .bar-track { flex: 1; background: #eaeef5; border-radius: 6px; height: 17px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .5s ease; }
    .bar-fill.hot { background: var(--fail); }
    .bar-fill.good { background: var(--ok); }
    .bar-val { width: 80px; flex: none; color: var(--muted); text-align: right; }
    .faq-q {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .faq-q:hover { border-color: var(--brand); }
    .faq-a {
      margin: 4px 0 4px;
      padding: 8px 12px;
      border-left: 3px solid var(--brand);
      background: var(--brand-soft);
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 160px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 120px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; text-align: right; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .kv { font-size: 0.85rem; line-height: 1.85; }
    .kv b { color: var(--brand); font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.75rem; background: #eef2f8; color: var(--muted); }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .pill.bad { background: #fee2e2; color: var(--fail); }
    .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .step-dot {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 0.35rem 0.6rem; font-size: 0.76rem; color: var(--muted);
    }
    .step-dot.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .matrix td, .matrix th { border: 1px solid var(--line); padding: 7px; text-align: center; font-size: 0.8rem; }
    .matrix td { background: #fff; }
    .banner-arrow { display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--brand); font-weight: bold; margin: 0 8px; }
    .chain-box { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; background: #fafcff; text-align: center; font-size: 0.88rem; }
    .flow-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .node-box { border: 1px solid var(--c0); background: var(--brand-soft); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 600; color: var(--brand); cursor: pointer; }
    .node-box:hover { filter: brightness(0.95); }
    .node-box.c1 { border-color: var(--c1); background: rgba(15,118,110,.1); color: var(--c1); }
    .node-box.c2 { border-color: var(--c2); background: rgba(21,128,61,.1); color: var(--c2); }
    .node-box.c3 { border-color: var(--c3); background: rgba(124,58,237,.1); color: var(--c3); }
    .connector { font-size: 1.2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>Kafka 交互演示</h1>
        <p>分布式提交日志 · 实时数据总线。点左侧章节，动手玩概念。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与定位' },
      { id: '02', title: '02 架构与核心概念' },
      { id: '03', title: '03 Producer 生产者' },
      { id: '04', title: '04 Consumer 消费者' },
      { id: '05', title: '05 存储与分区原理' },
      { id: '06', title: '06 高级特性' },
      { id: '07', title: '07 部署与集群规划' },
      { id: '08', title: '08 运维与故障排查' },
      { id: '09', title: '09 生态与大数据链路' },
      { id: '10', title: '10 生态对比与 FAQ' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    function show(id) {
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', `?c=${id}`)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述与定位 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>为什么需要 Kafka？三大流派 + 选型</h2>
        <p class="lead">点击卡片看消息队列三大流派，再点对比卡看 Kafka vs RocketMQ vs Pulsar vs RabbitMQ。</p>
        <h4>消息队列三大流派</h4>
        <div class="arch" id="schools"></div>
        <div class="detail" id="schoolsD">点击上方流派卡片。</div>

        <h4>Kafka vs RocketMQ vs RabbitMQ 综合对比</h4>
        <div class="arch" id="mqComp"></div>
        <div class="detail" id="mqCompD" style="min-height:2.8em">点击产品看适用场景。</div>

        <h4>这个场景该选谁？</h4>
        <div class="flow" id="decide"></div>
        <div class="verdict ok" id="decideD" style="min-height:4.5em">点一个场景。</div>
      `
      const schools = [
        ['点对点 Queue（RabbitMQ）', '一条消息只能被一个 Consumer 拿到。传统 AMQP 模型，业务解耦用得多，但吞吐上不去。'],
        ['发布订阅 Topic', '一条消息可被多个 Consumer Group 独立消费。Kafka/RocketMQ/Pulsar 都是这种模型。'],
        ['分布式提交日志（Kafka/Pulsar）', '消息是不可变、有 Offset 的日志，消费后不删除。这让它同时能做消息队列、事件溯源、流处理状态存储。'],
      ]
      const schoolsEl = el.querySelector('#schools'), schoolsD = el.querySelector('#schoolsD')
      schools.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 24)}…</span>`
        div.onclick = () => {
          schoolsEl.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); schoolsD.innerHTML = `<b>${n}</b>：${d}`
        }
        schoolsEl.appendChild(div)
      })

      const comps = [
        ['Kafka', '百万级/s 吞吐 · 毫秒级延迟 · 分布式提交日志模型 · Flink/Spark 原生支持 · 大数据实时链路首选'],
        ['RocketMQ', '十万级/s 吞吐 · 毫秒级延迟 · 半消息事务 · 延迟消息 · 业务消息 + 大数据兼顾 · 阿里系主推'],
        ['RabbitMQ', '万级/s 吞吐 · 微秒级低延迟 · AMQP 协议丰富 · 业务解耦 · 管理界面友好 · 小量高可靠'],
        ['Pulsar', '百万级/s 吞吐 · Broker 无状态 · 跨地域 Geo 复制 · 多租户命名空间 · 流存储统一 · 适合多集群'],
      ]
      const mqEl = el.querySelector('#mqComp'), mqD = el.querySelector('#mqCompD')
      comps.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 24)}…</span>`
        div.onclick = () => {
          mqEl.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); mqD.innerHTML = `<b>${n}</b>：${d}`
        }
        mqEl.appendChild(div)
      })

      const cases = [
        ['实时大数据链路（日志/CDC/埋点）', 'Kafka', 'ok'],
        ['电商交易小量解耦（高可靠/事务）', 'RocketMQ', 'ok'],
        ['极低延迟 AMQP 协议', 'RabbitMQ', 'ok'],
        ['跨地域多集群多租户', 'Pulsar', 'ok'],
        ['既要业务解耦又要大数据链路', 'Kafka 做大数据链路 + RocketMQ/RabbitMQ 做业务', 'warn'],
        ['自建成本敏感', 'Kafka（KRaft）或 RocketMQ（NameServer 简单）', 'warn'],
      ]
      const decEl = el.querySelector('#decide'), decD = el.querySelector('#decideD')
      cases.forEach(([q, a, cls]) => {
        const b = document.createElement('button')
        b.className = 'chip ghost'; b.type = 'button'; b.textContent = q
        b.onclick = () => {
          decEl.querySelectorAll('.chip').forEach(x => x.classList.add('ghost'))
          b.classList.remove('ghost')
          decD.className = 'verdict ' + cls
          decD.innerHTML = `推荐 <b>${a}</b>`
        }
        decEl.appendChild(b)
      })
    }

    /* ============ 02 架构与核心概念 ============ */
    function render02(el) {
      el.innerHTML = `
        <h2>Kafka 架构：点角色看职责</h2>
        <p class="lead">Broker/Topic/Partition/ISR/Controller。KRaft 用 Raft 替代 ZooKeeper。</p>
        <h4>核心角色（点击看职责）</h4>
        <div class="arch" id="roles"></div>
        <div class="detail" id="roleD">点击上方角色。</div>

        <h4>KRaft vs ZooKeeper：哪个模式？</h4>
        <div class="arch" id="kraftVs"></div>
        <div class="detail" id="kraftD">点击上方模式。</div>

        <h4>Producer → Partition 路由模拟</h4>
        <div class="slider-row"><span class="name">Topic 分区数</span><input type="range" id="np" min="1" max="12" value="6"><span class="val" id="npV">6</span></div>
        <div class="toolbar">
          <button class="primary" id="rk">随机发送 20 条</button>
          <button id="rk2">带 key 发送 20 条</button>
          <button id="rk3">重置</button>
        </div>
        <div id="partBars"></div>
        <p class="hint">无 key 时默认 Sticky Partitioner（粘到一个 Partition 直到 batch 满）；有 key 时按 Murmur2 hash(key) % numPartitions 固定。</p>
      `
      const roles = [
        ['Broker', '集群中的一台 Kafka 服务器。存 Partition 的 Segment 日志，对外服务 Producer/Consumer 请求，Controller 协调下做 ISR 同步与 Leader 选举。'],
        ['Controller', '集群大脑。负责 Partition Leader 选举、Topic 管理、Broker 上下线监听。KRaft 模式下 Controller Quorum 用 Raft 协议选主。'],
        ['Topic', '消息的逻辑分类。比如「order-events」「user-activity」。Topic 不直接存消息，它是 Partition 的集合。'],
        ['Partition', 'Topic 的物理分片，每个分区是一个有序追加日志。每个 Partition 有自己独立的 Offset，顺序性只在 Partition 内保证。'],
        ['Replica', 'Partition 在某个 Broker 上的一份拷贝。Leader 负责读写；Follower 从 Leader 主动 Fetch 同步。'],
        ['ISR', 'In-Sync Replicas。与 Leader 保持同步的副本集合（Leader + 追得上的 Follower）。acks=all 必须这些都 sync 才算成功。'],
        ['OSR', 'Out-of-Sync Replicas。不在 ISR 里的副本——落后太多。不会参与 ack=all，也不会被选做新 Leader。'],
        ['Consumer Group', '一组协同消费的 Consumer。组内每个 Partition 只能被一个 Consumer 消费；Group 间独立进度。'],
      ]
      const rEl = el.querySelector('#roles'), rD = el.querySelector('#roleD')
      roles.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => {
          rEl.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); rD.innerHTML = `<b>${n}</b>：${d}`
        }
        rEl.appendChild(div)
      })

      const kv = [
        ['KRaft（推荐）', '元数据存在 Broker 内部的 Metadata Log（Raft 协议维护）。少一个外部组件，启动快，支持百万级 Partition。3.5 GA，4.0 计划移除 ZK。'],
        ['ZooKeeper（老模式）', '元数据存在外部 ZK 集群。成熟稳定但运维成本高、Partition 上限约 3 万、Broker 启动慢。3.8 起 deprecated。'],
      ]
      const kvEl = el.querySelector('#kraftVs'), kvD = el.querySelector('#kraftD')
      kv.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => {
          kvEl.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); kvD.innerHTML = `<b>${n}</b>：${d}`
        }
        kvEl.appendChild(div)
      })

      const np = el.querySelector('#np'), npV = el.querySelector('#npV')
      function drawBars(counts, key) {
        const n = +np.value
        npV.textContent = `${n} 分区`
        const total = counts.reduce((a, b) => a + b, 0) || 1
        el.querySelector('#partBars').innerHTML = counts.map((v, i) =>
          `<div class="bar-row"><span class="lbl">P-${i}</span><span class="bar-track"><span class="bar-fill" style="width:${(v / total * 100).toFixed(1)}%"></span></span><span class="bar-val">${v} 条</span></div>`
        ).join('') + `<p class="hint">${key ? '带 key：固定分布在 Part 2（hash(key)%6=2）' : '无 key：Sticky Partitioner 倾向粘到少数分区（提高批处理效果）'}</p>`
      }
      let counts = Array(+np.value).fill(0)
      drawBars(counts, false)
      np.oninput = () => { counts = Array(+np.value).fill(0); drawBars(counts, false) }
      el.querySelector('#rk').onclick = () => {
        for (let i = 0; i < 20; i++) {
          const n = +np.value
          // Sticky: 粘到一个随机分区
          const stickyP = Math.floor(Math.random() * n)
          counts[stickyP] += 1
        }
        drawBars(counts, false)
      }
      el.querySelector('#rk2').onclick = () => {
        const n = +np.value
        for (let i = 0; i < 20; i++) {
          const key = `key-${i}`
          // Murmur2 hash modulo
          let h = 0
          for (let j = 0; j < key.length; j++) h = (h * 31 + key.charCodeAt(j)) >>> 0
          const p = h % n
          counts[p] += 1
        }
        drawBars(counts, true)
      }
      el.querySelector('#rk3').onclick = () => { counts = Array(+np.value).fill(0); drawBars(counts, false) }
    }

    /* ============ 03 Producer 生产者原理 ============ */

      const steps = [

        ['Accumulator', '进 RecordAccumulator —— 按 Broker+Partition 分组，攒成 RecordBatch（默认 16KB / linger 超时）。'],

        ['Callback', 'Producer 收到 Response → 按错误码判断：可重试错误（网络超时/NOT_LEADER）自动重试；不可重试（RecordTooLarge）抛异常。Future.complete() 触发用户回调。'],

      const runP = el.querySelector('#runP')
      const acksS = el.querySelector('#acksS'), idem = el.querySelector('#idempotent'), tx = el.querySelector('#tx')
      function runSim() {
        const acks = +acksS.value
        const ide = idem.checked
        const txOn = tx.checked
        let loss = 0, dup = 0, latency = 0, msg = []
        for (let i = 0; i < 1000; i++) {
          // 模拟 Leader 挂的概率 0.1%
          const leaderCrash = Math.random() < 0.001
          // 模拟 ISR 丢一个 Follower 概率 0.2%
          const isrSmall = Math.random() < 0.002
          if (acks === 0 && leaderCrash) { loss++ }
          if (acks === 1 && leaderCrash) { loss++ }
          if (acks === 1 && Math.random() < 0.001) { dup++ } // Broker 落盘但 Response 丢了 → Producer 重试
          if (acks === 'all') {
            if (isrSmall) { latency += 15 } // ISR 小 → 可能被拒绝 → 等待 Follower 追
            if (leaderCrash && ide) { /* 幂等去重，忽略 */ }
            if (leaderCrash && !ide) { dup++ } // Leader 切换 → Producer 重试
          }
          if (txOn) { latency += 20 } // 事务多一次 RPC
          latency += 1 + Math.random() * 3
        }
        msg.push(`发送 1000 条模拟（acks=${acks}${ide ? ', 幂等' : ''}${txOn ? ', 事务' : ''}）`)
        msg.push(`安全诊断:`)
        if (loss === 0 && dup === 0) msg.push(`  ✅ 不丢不重：${loss} 条丢失，${dup} 条重复`)
        else {
          if (loss > 0) msg.push(`  ❌ 丢失 ${loss} 条 → 建议 acks=all + min.insync.replicas=2`)
          if (dup > 0) msg.push(`  ⚠️ 重复 ${dup} 条 → 建议 enable.idempotence=true`)
        }
        msg.push(`平均延迟 ≈ ${(latency / 1000).toFixed(1)} ms（Broker 落盘 + ISR 同步 + 网络 RTT）`)
        if (acks === 'all' && ide) msg.push(`  已开启幂等 Producer：同 Partition 内 SeqNo 去重，Broker 丢弃重复请求不报错`)

        const cls = loss === 0 && dup === 0 ? 'ok' : 'warn'
        el.querySelector('#simOut').innerHTML = `<div class="verdict ${cls}">${msg.join('<br>')}</div>`
      }
      runP.onclick = runSim
      el.querySelector('#resetP2').onclick = () => { el.querySelector('#simOut').innerHTML = '' }

    /* ============ 07 部署与集群规划 ============ */
    function render07(el) {
      el.innerHTML = `

        <div class="slider-row"><span class="name">单盘容量</span><input type="range" id="diskCap" min="1" max="20" value="4"><span class="val" id="capV">4 TB</span></div>
        <div class="slider-row"><span class="name">Broker 预留</span><input type="range" id="reserve" min="5" max="20" value="10" step="5"><span class="val" id="resV">10%</span></div>

        <h4>KRaft 部署建议</h4>
        <div class="arch" id="deployTypes"></div>
        <div class="detail" id="deployD">点击部署模式。</div>
      `
      const dTps = el.querySelector('#dailyTps'), mSz = el.querySelector('#msgSz'), rep = el.querySelector('#rep'), ret = el.querySelector('#ret')
      const dN = el.querySelector('#diskNum'), dC = el.querySelector('#diskCap'), res = el.querySelector('#reserve')
      function plan() {
        const tps = +dTps.value, msg = +mSz.value, rf = +rep.value, days = +ret.value
        const diskN = +dN.value, diskC = +dC.value, resP = +res.value / 100
        el.querySelector('#dailyV').textContent = tps.toLocaleString() + '/s'
        el.querySelector('#msgSzV').textContent = msg >= 1024 ? (msg / 1024).toFixed(1) + ' KB' : msg + ' B'
        el.querySelector('#repV').textContent = rf
        el.querySelector('#retV').textContent = days + ' 天'
        el.querySelector('#diskNV').textContent = diskN + ' 盘'
        el.querySelector('#capV').textContent = diskC + ' TB'
        el.querySelector('#resV').textContent = (resP * 100) + '%'
        const dailyTB = tps * 86400 * msg / 1024 / 1024 / 1024 / 1024
        const totalTB = dailyTB * rf * days
        const brokerDiskTB = diskN * diskC * (1 - resP)
        const brokerCount = Math.ceil(totalTB / brokerDiskTB)
        const brokers = Math.max(brokerCount, 3)
        el.querySelector('#planOut').innerHTML =
          `每日数据 = <b>${dailyTB.toFixed(1)} TB</b>；${rf} 副本 × ${days} 天 = <b>${totalTB.toFixed(0)} TB</b> 总量<br>` +
          `单 Broker 可用 = ${diskN} 盘 × ${diskC} TB × ${(1 - resP).toFixed(1)} = <b>${brokerDiskTB.toFixed(1)} TB</b><br>` +
          `建议 Broker 数 = ceil(${totalTB.toFixed(0)} / ${brokerDiskTB.toFixed(1)}) = <b>${brokers}</b><br>` +

           brokers <= 10 ? 'KRaft 合并部署或独立 3 节点 Controller Quorum。' : 'KRaft 独立 3+5 节点 Controller Quorum（Raft 选主），Broker 纯 Broker 角色。')
      }
      ;[dTps, mSz, rep, ret, dN, dC, res].forEach(x => x.oninput = plan); plan()

      const depls = [
        ['合并部署（Broker + Controller）', '3 个进程（node.id 1/2/3）各自 process.roles=broker,controller，共享 log.dirs。适合 < 10 Broker 的集群。少组件，运维极简。'],
        ['独立 Controller（3 节点）', '3 个纯 Controller 节点 + N 个 Broker 节点。适合 10-50 Broker。Raft Quorum 要奇数（2F+1），允许 1 个挂。'],

      ]

      depls.forEach(([n, d]) => {

        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => {
          depEl.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); depD.innerHTML = `<b>${n}</b>：${d}`
        }
        depEl.appendChild(div)
      })
    }

        ['Q5: Broker 宕机后 Partition 怎么恢复？', 'Controller 检测 → 从剩余 ISR 选新 Leader → Follower 从新 Leader 继续同步 → 原 Broker 重启追日志 → 重新进 ISR → Controller 可能 PreferReplicaLeaderElection 把 Leader 还回去。'],
        ['Q6: KRaft vs ZooKeeper 哪个好？', 'KRaft：少一个外部组件、Broker 启动快、支持百万级 Partition、Controller 切换快。3.7 起生产推荐；4.0 计划完全移除 ZK。ZooKeeper 仅存量集群。'],
        ['Q7: 为什么 Kafka 不支持减分区？', 'key → partition 映射 = hash(key) % numPartitions。减分区这个映射会大变，同一 key 的数据跑到不同 Partition，消费顺序被打乱。Kafka 认为是破坏性变更。'],
        ['Q8: acks=all 到底多安全？', '要求 ISR 所有副本都 sync。但 ISR 可能只剩 Leader 一个（Follower 被踢），此时 acks=all 退化到 acks=1。必须配 min.insync.replicas=2 + replication.factor=3。ISR < 2 时 Broker 拒绝写入。'],
        ['Q9: KRaft 何时全面替代 ZK？', '当前 2026 Q4：3.8 起 ZK deprecated；4.0（2025 Q4 计划）完全移除。迁移路径：升级到 3.5+（ZK）→ 启动 KRaft Controller Quorum → 执行 kafka-metadata-quorum.sh --migrate → 逐步切换 Broker。'],
        ['Q10: Kafka on K8s 现状？', '主流方案：Strimzi（Red Hat，KRaft 支持好，社区活跃）、Bitnami Helm Chart、Confluent Operator。坑：本地盘 vs 云盘、跨 AZ 网络延迟、advertised.listeners 正确配置、CPU limit 太紧 → GC 停顿 → Consumer Rebalance。'],
        ['Q11: 生产怎么规划 Partition 数？', '① 按 Consumer Group 最大并行数；② 按写入 QPS / 单 Partition 目标 QPS（~10000）；③ 加 30-50% 余量；④ 宁多勿少（只能增不能减）。'],
        ['Q12: Kafka、RocketMQ、Pulsar、RabbitMQ 分别适合什么场景？', 'Kafka：大数据实时链路首选；RocketMQ：业务消息 + 大数据兼顾 + 阿里系；Pulsar：跨地域 / 多租户 / 流存储；RabbitMQ：业务小量 / 极低延迟 / AMQP 协议。'],
      ]
      const box = el.querySelector('#faqBox')
      faqs.forEach(([q, a]) => {
        const b = document.createElement('button')
        b.className = 'faq-q'; b.textContent = q
        const ans = document.createElement('div')
        ans.className = 'faq-a hidden'; ans.innerHTML = a
        b.onclick = () => {
          ans.classList.toggle('hidden')
        }
        box.appendChild(b); box.appendChild(ans)
      })
    }

    /* ============ 渲染注册表 ============ */
    const renders = {
      '01': render01, '02': render02, '03': render03, '04': render04,
      '05': render05, '06': render06, '07': render07, '08': render08,
      '09': render09, '10': render10,
    }

    // 初始化
    show(current)
  </script>
