<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apache Spark · 交互式演示</title>
  <style>
    :root {
      --bg: #f7f6f4;
      --panel: #fff;
      --ink: #1c1917;
      --muted: #6b645d;
      --line: rgba(28, 25, 23, 0.12);
      --brand: #c2410c;
      --brand-soft: rgba(226, 90, 28, 0.12);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 880px) {
      .app { grid-template-columns: 200px 1fr; align-items: start; }
    }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav {
        flex-direction: column;
        position: sticky; top: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }
    }
    .nav button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.86rem;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      white-space: nowrap;
    }
    @media (min-width: 880px) {
      .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; }
      .nav button:hover { background: #f4f1ee; }
    }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 22px;
      min-height: 420px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 22px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .lead b, .concl b { color: var(--brand); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .log {
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #1c1917;
      color: #e7e5e4;
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .log .hot { color: #fb923c; }
    .log .dim { color: #a8a29e; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.4rem 0.5rem; text-align: left; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      background: #f5f3f0;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 170px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 90px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .verdict.info { background: var(--brand-soft); border: 1px solid rgba(194,65,12,.3); }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 5px; }
    .bar-row .lbl { width: 130px; color: var(--muted); flex: none; text-align: right; }
    .bar-track { flex: 1; background: #f0ede9; border-radius: 6px; height: 18px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .8s ease; }
    .bar-fill.hot { background: var(--fail); }
    .bar-fill.good { background: var(--ok); }
    .bar-fill.warn { background: var(--warn); }
    .bar-val { width: 130px; flex: none; color: var(--muted); }
    .bar-val b { color: var(--ink); }
    /* 赛道（赛跑对比） */
    .race-lane { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; margin-top: 10px; }
    .race-head { display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: 600; }
    .race-status { font-size: 0.78rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; margin: 6px 0; min-height: 1.6em; }
    .race-track { background: #f0ede9; border-radius: 6px; height: 20px; overflow: hidden; }
    /* 舞台（动画画布） */
    .stagebox { position: relative; height: 340px; background: #fafbfc; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 10px; }
    .actor { position: absolute; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; padding: 6px 8px; font-size: 0.78rem; }
    .actor .cap { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    .actor.hl { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .taskblock { position: absolute; width: 22px; height: 22px; border-radius: 6px; z-index: 6; transition: left .7s ease, top .7s ease, opacity .3s; }
    .phase { font-size: 0.82rem; font-weight: 600; color: var(--brand); }
    .core-slot { display: inline-block; width: 24px; height: 24px; border: 1px dashed var(--line); border-radius: 6px; margin: 2px; vertical-align: top; }
    /* 流水线 */
    .pipe-row { display: flex; align-items: center; gap: 4px; margin-top: 10px; position: relative; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .pipe-row .pname { width: 62px; flex: none; font-size: 0.75rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .op-box { border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 0.75rem; background: #fafbfc; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
    .op-box.armed { border-style: dashed; border-color: var(--run); color: var(--run); }
    .op-box.fired { border-color: var(--ok); background: #f0fdf4; }
    .pipe-arrow { color: var(--muted); flex: none; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); position: absolute; transition: left 1s linear; z-index: 5; }
    /* 甘特图 */
    .gantt { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 12px; margin-top: 10px; position: relative; }
    .gantt-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .gantt-lbl { width: 78px; flex: none; color: var(--muted); text-align: right; }
    .gantt-track { flex: 1; background: #f0ede9; border-radius: 6px; height: 18px; position: relative; overflow: hidden; }
    .gantt-fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; transition: left .8s ease, width .8s ease; }
    /* 装箱 */
    .workers { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 10px; }
    .worker { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 8px; min-height: 120px; }
    .worker .cap { font-size: 0.75rem; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
    .worker .free { font-size: 0.7rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .exec-tile { display: inline-block; margin: 3px 3px 0 0; padding: 4px 7px; border-radius: 6px; background: var(--run); color: #fff; font-size: 0.68rem; font-family: ui-monospace, Menlo, monospace; }
    .exec-tile.wait { background: #d6d3d1; color: var(--fail); text-decoration: line-through; }
    /* JVM ↔ Python 传输 */
    .sysgrid { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 0; margin-top: 10px; align-items: stretch; }
    .sysbox { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; min-height: 130px; padding: 8px; position: relative; overflow: hidden; }
    .sysbox .cap { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    .channel { position: relative; }
    .channel::before { content: ""; position: absolute; left: 50%; top: 8px; bottom: 8px; border-left: 2px dashed var(--line); }
    .pkt { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); z-index: 5; transition: left .45s ease, opacity .3s; }
    .pkt.arrow-batch { width: 34px; height: 18px; border-radius: 5px; background: var(--ok); }
    .xfer-count { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 0.68rem; color: var(--warn); font-weight: 700; white-space: nowrap; }
    /* Shuffle 舞台 */
    .part-box { position: absolute; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; padding: 4px; width: 132px; }
    .part-box .cap { font-size: 0.72rem; color: var(--muted); text-align: center; display: block; margin-bottom: 2px; }
    .keychip { position: absolute; width: 26px; height: 26px; border-radius: 7px; color: #fff; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: left .8s ease, top .8s ease; z-index: 5; }
    .spill { position: absolute; font-size: 0.66rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    /* Watermark 时间轴 */
    .timeline { position: relative; height: 130px; background: #fafbfc; border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; }
    .tl-axis { position: absolute; left: 20px; right: 20px; bottom: 24px; height: 2px; background: var(--line); }
    .tl-tick { position: absolute; bottom: 18px; font-size: 0.68rem; color: var(--muted); transform: translateX(-50%); }
    .ev { position: absolute; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); bottom: 44px; background: var(--run); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); transition: bottom .4s, background .4s, top .3s; }
    .ev.late { background: var(--fail); }
    .ev.done { background: var(--ok); }
    .wm-line { position: absolute; top: 8px; bottom: 16px; width: 0; border-left: 2px dashed var(--brand); transition: left .4s; }
    .wm-tag { position: absolute; top: 2px; transform: translateX(-50%); font-size: 0.68rem; color: var(--brand); font-weight: 700; white-space: nowrap; }
    .win-grid { display: flex; gap: 6px; margin-top: 10px; }
    .win-cell { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 0.72rem; color: var(--muted); background: #fff; min-height: 46px; }
    .win-cell.open { border-color: var(--run); color: var(--run); }
    .win-cell.closed { border-color: var(--ok); background: #f0fdf4; color: var(--ok); }
    /* 内存条 / 计划树 / 矩阵 */
    .membar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); margin-top: 8px; }
    .memseg { display: flex; align-items: center; justify-content: center; font-size: 0.68rem; color: #fff; overflow: hidden; white-space: nowrap; transition: width .3s; }
    svg.canvas { width: 100%; height: auto; display: block; background: #fafbfc; border-radius: 12px; border: 1px solid var(--line); margin-top: 10px; }
    .matrix { border-collapse: collapse; margin-top: 8px; }
    .matrix td, .matrix th { border: 1px solid var(--line); padding: 8px 10px; text-align: center; font-size: 0.82rem; }
    .matrix td.cell { cursor: pointer; background: #fff; }
    .matrix td.cell:hover { background: var(--brand-soft); }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .chip { border: none; border-radius: 999px; padding: 0.35rem 0.75rem; background: var(--brand-soft); color: var(--brand); font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .chip.ghost { background: #f0ede9; color: var(--muted); font-weight: 500; }
    .stack { display: grid; gap: 6px; margin-top: 10px; }
    .stack .layer { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.82rem; background: #fff; }
    .stack .layer b { margin-right: 8px; }
    .stack .core { border-color: var(--brand); background: var(--brand-soft); }
    .concl { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--brand-soft); font-size: 0.88rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>Spark 交互演示</h1>
        <p>只演示难懂的概念：动画 + 模拟器。点左侧章节开玩。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与定位' },
      { id: '02', title: '02 架构与运行原理' },
      { id: '03', title: '03 RDD 核心抽象' },
      { id: '04', title: '04 DataFrame 操作' },
      { id: '05', title: '05 SQL 与 Catalyst' },
      { id: '06', title: '06 Shuffle 与 Join' },
      { id: '07', title: '07 部署与资源' },
      { id: '08', title: '08 性能调优' },
      { id: '09', title: '09 Structured Streaming' },
      { id: '10', title: '10 生态对比与 FAQ' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    // 切章时清理上一章的定时器
    let timers = []
    function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t }
    function every(fn, ms) { const t = setInterval(fn, ms); timers.push(t); return t }
    function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t) }); timers = [] }

    function show(id) {
      clearTimers()
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', `?c=${id}`)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述：MR vs Spark 迭代赛跑 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>为什么迭代计算上 Spark 快 10~100 倍？</h2>
        <p class="lead">同一份数据反复迭代（机器学习训练的典型模式）：MapReduce <b>每轮都读写磁盘</b>，Spark <b>只读一次、之后全在内存</b>。选择迭代轮数，点开始赛跑——两边按真实耗时比例推进。</p>
        <div class="toolbar">
          <label>迭代轮次 <input type="range" id="iters" min="1" max="50" value="10" style="width:140px;vertical-align:middle"> <span class="phase" id="vIters">10</span> 轮</label>
          <button class="primary" id="race">开始赛跑</button>
          <button id="ff">快进 ⏩</button>
          <button id="raceReset">重置</button>
        </div>
        <div class="race-lane">
          <div class="race-head"><span style="color:var(--fail)">MapReduce</span><span id="mrIo" style="font-family:ui-monospace,Menlo,monospace;font-weight:400;color:var(--muted)">磁盘读写 0 次</span></div>
          <div class="race-status" id="mrStatus">等待开始</div>
          <div class="race-track"><div class="bar-fill hot" id="mrBar" style="width:0%"></div></div>
        </div>
        <div class="race-lane">
          <div class="race-head"><span style="color:var(--ok)">Spark</span><span id="spIo" style="font-family:ui-monospace,Menlo,monospace;font-weight:400;color:var(--muted)">磁盘读写 0 次</span></div>
          <div class="race-status" id="spStatus">等待开始</div>
          <div class="race-track"><div class="bar-fill good" id="spBar" style="width:0%"></div></div>
        </div>
        <div id="raceResult"></div>
        <div class="concl" id="raceConcl" style="visibility:hidden">结论</div>
        <h4>Spark 生态一张图（了解即可，无需演示）</h4>
        <div class="stack">
          <div class="layer"><b>MLlib · GraphX</b>分布式机器学习 / 图计算</div>
          <div class="layer"><b>Spark SQL · Structured Streaming</b>DataFrame、SQL、流批一体——日常开发 90% 在这里</div>
          <div class="layer core"><b>Spark Core</b>RDD 抽象、DAG 调度、内存管理、容错——所有组件的地基</div>
          <div class="layer"><b>资源调度</b>YARN · Kubernetes · Standalone</div>
        </div>
      `
      // 虚拟耗时单位：磁盘操作=10，磁盘外计算=2，内存迭代=0.2
      const D = 10, C = 2, MEM = 0.2
      const $ = s => el.querySelector(s)
      let racing = false
      function totals(N) {
        return { mr: N * (2 * D + C), sp: D + C + (N - 1) * MEM }
      }
      function paint(N, t, done) {
        const T = totals(N)
        const mrT = Math.min(t, T.mr), spT = Math.min(t, T.sp)
        // MR 状态：每轮 读盘→计算→写盘
        const perRound = 2 * D + C
        const round = Math.min(N, Math.floor(mrT / perRound) + (mrT >= T.mr ? 0 : 1))
        const inRound = mrT % perRound
        const mrPhase = mrT >= T.mr ? '✔ 完成' : (inRound < D ? '📥 读盘（HDFS → 内存）' : (inRound < D + C ? '⚙️ 计算' : '📤 写盘（结果 → HDFS）'))
        const mrIo = Math.min(2 * N, 2 * Math.floor(mrT / perRound) + (inRound >= D + C ? 1 : 0) + (mrT >= T.mr ? 0 : (inRound < D ? 1 : 0)))
        $('#mrIo').textContent = `磁盘读写 ${mrIo} 次`
        $('#mrStatus').textContent = mrT >= T.mr ? `完成：${N} 轮迭代` : `第 ${round}/${N} 轮 · ${mrPhase}`
        $('#mrBar').style.width = (mrT / T.mr * 100) + '%'
        // Spark 状态
        const spDone = spT >= T.sp
        let spRound
        if (spT < D + C) spRound = 1
        else spRound = Math.min(N, 1 + Math.floor((spT - D - C) / MEM) + 1)
        $('#spIo').textContent = '磁盘读写 ' + (spT > 0 ? 1 : 0) + ' 次'
        $('#spStatus').textContent = spDone ? `完成：${N} 轮迭代` : (spT < D ? '第 1 轮 · 📥 读盘（仅此一次）' : `第 ${spRound}/${N} 轮 · ⚡ 内存中迭代`)
        $('#spBar').style.width = (spT / T.sp * 100) + '%'
        return { spDone, mrDone: mrT >= T.mr }
      }
      function verdict(N, ff) {
        const T = totals(N)
        const ratio = T.mr / T.sp
        $('#raceResult').innerHTML = `
          <div class="bar-row"><span class="lbl">MapReduce</span><div class="bar-track"><div class="bar-fill hot" style="width:100%"></div></div><span class="bar-val"><b>${T.mr.toFixed(0)}</b> 时间单位</span></div>
          <div class="bar-row"><span class="lbl">Spark</span><div class="bar-track"><div class="bar-fill good" style="width:${Math.max(1.5, 100 / ratio)}%"></div></div><span class="bar-val"><b>${T.sp.toFixed(0)}</b> 时间单位</span></div>`
        const c = $('#raceConcl')
        c.style.visibility = 'visible'
        c.innerHTML = `迭代 <b>${N}</b> 轮：Spark 快 <b>${ratio.toFixed(1)}×</b>；磁盘读写 <b>${2 * N} 次 vs 1 次</b>。轮数越多差距越夸张——这就是 ML 训练必须用 Spark 类引擎的原因。<br><span class="hint" style="margin:0">注意：Spark ≠ 全内存宗教——内存放不下照样溢写磁盘，快在「能不落盘就不落盘 + DAG 全图优化」。</span>`
      }

      function runTasks(tasks, color, dur, onAllDone) {

          `<table class="tbl"><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>` +
          rows.map(r => `<tr>${cols.map(c => `<td>${r[c]}</td>`).join('')}</tr>`).join('') + '</table>'
      }
      opsBox.querySelectorAll('input').forEach(i => i.onchange = render_)
      render_()

      // UDF 传输动画
      const jvm = el.querySelector('#jvm'), py = el.querySelector('#py'), chan = el.querySelector('#chan')
      const xferCount = el.querySelector('#xferCount')
      const udfBar = el.querySelector('#udfBar'), udfT = el.querySelector('#udfT'), udfV = el.querySelector('#udfVerdict')
      function resetXfer() {
        chan.querySelectorAll('.pkt').forEach(p => p.remove())
        jvm.querySelectorAll('.pkt').forEach(p => p.remove())
        py.querySelectorAll('.pkt').forEach(p => p.remove())
        xferCount.textContent = ''
        udfBar.style.transition = 'none'; udfBar.style.width = '0'
        void udfBar.offsetWidth; udfBar.style.transition = ''
        udfT.textContent = ''
      }
      function fly(fromBox, toBox, cls, delay, onArrive) {
        const from = fromBox.getBoundingClientRect(), to = toBox.getBoundingClientRect(), base = chan.getBoundingClientRect()
        const p = document.createElement('div')
        p.className = 'pkt ' + (cls || '')
        const y = 60
        p.style.top = (y - base.top) + 'px'
        p.style.left = (from.right - base.left - 14) + 'px'
        chan.appendChild(p)
        later(() => { p.style.left = (to.left - base.left + 2) + 'px' }, delay)
        later(() => { p.style.left = (from.right - base.left - 14) + 'px' }, delay + 520)
        later(() => { p.remove(); onArrive && onArrive() }, delay + 1100)
      }
      let playing = false
      el.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => {
        if (playing) return
        playing = true
        resetXfer()
        const mode = btn.dataset.mode
        const finish = (mult, color, html) => {
          udfBar.style.background = color
          udfBar.style.width = Math.min(100, mult / 30 * 100) + '%'
          udfT.innerHTML = `<b>${mult}×</b>`
          udfV.className = 'verdict ' + (mult === 1 ? 'ok' : mult <= 4 ? 'warn' : 'bad')
          udfV.innerHTML = html
          playing = false
        }
        if (mode === 'builtin') {
          const p = document.createElement('div')
          p.className = 'pkt'; p.style.background = 'var(--ok)'
          p.style.cssText += ';left:30px;top:60px'
          jvm.appendChild(p)
          later(() => { p.style.left = (jvm.clientWidth - 60) + 'px' }, 100)
          xferCount.textContent = '0 次'
          later(() => finish(1, 'var(--ok)', '<b>内置函数</b>：计算发生在 JVM 内部，数据不出进程。Catalyst 还能为它做向量化优化——永远的首选。'), 1200)
        } else if (mode === 'row') {
          xferCount.textContent = '跨进程 …'
          let n = 0
          for (let i = 0; i < 6; i++) {
            fly(jvm, py, '', i * 620, () => {
              n++
              xferCount.textContent = `往返 ${n} 次`
              if (n === 6) finish(30, 'var(--fail)', '<b>普通 Python UDF</b>：100 万行 = 100 万次序列化往返，比内置函数慢 <b>~30×</b>，还阻断 Catalyst 优化。能不写就不写。')
            })
          }
        } else {
          fly(jvm, py, 'arrow-batch', 100, () => {
            xferCount.textContent = '1 次批量'
            finish(4, 'var(--warn)', '<b>pandas_udf</b>：用 Arrow 按「列批」传输 + pandas/numpy 向量化计算，只慢 <b>~4×</b>。必须自定义逻辑时用它。')
          })
        }
      })
      el.querySelector('#xferReset').onclick = () => { clearTimers(); playing = false; resetXfer() }
    }

        <h2>资源装箱：你的 Executor 配置真的能用起来吗？</h2>
        <p class="lead">集群有 3 个 Worker 节点（各 <b>16 核 / 64GB</b>）。拖动滑块配置 Executor，看它们如何被「装进」节点——装不下的排队等待，缝隙就是浪费。</p>
        <div class="slider-row"><span class="name">num-executors</span><input type="range" id="ne" min="1" max="24" value="9"><span class="val" id="vne">9</span></div>
        <div class="slider-row"><span class="name">executor-cores</span><input type="range" id="ec" min="1" max="16" value="4"><span class="val" id="vec">4</span></div>
        <div class="slider-row"><span class="name">executor-memory (GB)</span><input type="range" id="em" min="1" max="64" value="16"><span class="val" id="vem">16 GB</span></div>
        <div class="workers" id="workers"></div>
        <div class="verdict" id="resVerdict"></div>
        <h4>单个 Executor 的内存结构</h4>
        <div class="slider-row"><span class="name">spark.memory.fraction</span><input type="range" id="mf" min="30" max="80" value="60"><span class="val" id="vmf">0.60</span></div>
        <div class="membar" id="membar"></div>
        <p class="hint">Execution（Shuffle/聚合缓冲）与 Storage（cache）可互借；PySpark worker 用的是 overhead 堆外内存，不占 JVM 堆。</p>
        <h4>spark-submit 模板（随滑块联动）</h4>
        <div class="code" id="submitTpl"></div>
      `
      const $ = s => el.querySelector(s)
      function pack() {
        const ne = +$('#ne').value, ec = +$('#ec').value, em = +$('#em').value
        $('#vne').textContent = ne; $('#vec').textContent = ec; $('#vem').textContent = em + ' GB'
        const overhead = Math.max(0.384, em * 0.1)
        const askMem = em + overhead // YARN 实际申请
        // 装箱：顺序填充
        const nodes = Array.from({ length: 3 }, () => ({ cores: NODE_CORES, mem: NODE_MEM, list: [] }))
        let waiting = 0
        for (let i = 0; i < ne; i++) {
          const node = nodes.find(n => n.cores >= ec && n.mem >= askMem)
          if (node) { node.cores -= ec; node.mem -= askMem; node.list.push(i) }
          else waiting++
        }
        $('#workers').innerHTML = nodes.map((n, i) => `
          <div class="worker">
            <span class="cap">Worker ${i + 1}（16 核 / 64G）</span>
            <div>${n.list.map(() => `<span class="exec-tile">${ec}c · ${em}G</span>`).join('')}
            ${Array.from({ length: waiting }).filter((_, k) => i === 0).map(() => '').join('')}</div>
            <span class="free">剩余 ${n.cores} 核 / ${n.mem.toFixed(1)}G${n.cores > 0 && (n.cores < ec || n.mem < askMem) ? ' ⚠ 碎片' : ''}</span>
          </div>`).join('') + (waiting ? `<div class="worker" style="border-style:dashed"><span class="cap" style="color:var(--fail)">等待队列</span>${Array.from({ length: waiting }).map(() => `<span class="exec-tile wait">${ec}c · ${em}G</span>`).join('')}<span class="free" style="color:var(--fail)">集群放不下，排队中</span></div>` : '')

        const probs = []
        if (ec > 6) probs.push(`executor-cores=${ec} 偏大：单 Executor 内线程争抢 HDFS/网络吞吐，建议 4~6`)
        if (em > 32) probs.push(`executor-memory=${em}G 超 32G：大堆 GC 收益递减，建议拆成多个小 Executor`)
        if (waiting) probs.push(`${waiting} 个 Executor 装不进集群：单个要 ${ec}c/${askMem.toFixed(1)}G（含 overhead），要么调小要么扩容`)
        const frag = nodes.filter(n => n.cores > 0 && (n.cores < ec || n.mem < askMem)).length
        if (frag && !waiting) probs.push(`${frag} 个节点有装不下的碎片资源被闲置`)
        if (ne * ec < 12 && !probs.length) probs.push(`总并发 ${ne * ec} 核偏低：大作业可能吃不饱集群`)
        const v = $('#resVerdict')
        if (probs.length) { v.className = 'verdict warn'; v.innerHTML = '体检建议：<br>· ' + probs.join('<br>· ') }
        else { v.className = 'verdict ok'; v.innerHTML = `配置健康 ✔ 总并发 <b>${ne * ec}</b> 核，总堆内存 <b>${ne * em} GB</b>（经验甜点：4~6 核、8~16G，数量随数据量伸缩）` }

        $('#submitTpl').textContent =
`spark-submit \\
  --master yarn --deploy-mode cluster \\
  --num-executors ${ne} \\
  --executor-cores ${ec} \\
  --executor-memory ${em}G \\
  --driver-memory 4G \\
  --conf spark.sql.adaptive.enabled=true \\
  --conf spark.serializer=org.apache.spark.serializer.KryoSerializer \\
  main.py --dt \${bizdate}`

        const mf = +$('#mf').value
        $('#vmf').textContent = (mf / 100).toFixed(2)
        const unified = mf, user = 100 - mf, half = unified / 2
        $('#membar').innerHTML =
          `<div class="memseg" style="width:${half}%;background:#0369a1">Execution ${half}%</div>` +
          `<div class="memseg" style="width:${half}%;background:#15803d">Storage ${half}%</div>` +
          `<div class="memseg" style="width:${user}%;background:#6b645d">User ${user}%</div>`
      }
      ;['ne', 'ec', 'em', 'mf'].forEach(i => $('#' + i).oninput = pack)
      pack()
    }

    /* ============ 08 倾斜甘特图 + 小文件 ============ */
    function render08(el) {
      el.innerHTML = `
        <h2>数据倾斜：为什么 99% 的 Task 在等 1 个 Task？</h2>
        <p class="lead">拖「倾斜因子」制造热点 key，看 10 个 Task 的耗时分布；再点「加盐」重放——两阶段聚合如何把热点打散。<b>Job 的总耗时由最慢的那个 Task 决定。</b></p>
        <div class="slider-row"><span class="name">倾斜因子（热点 key 占比）</span><input type="range" id="skew" min="0" max="90" value="70"><span class="val" id="vskew">70%</span></div>
        <div class="toolbar"><button class="primary" id="salt">▶ 重放：加盐两阶段聚合</button><button id="resetSkew">重置</button></div>
        <div class="gantt" id="skewGantt"></div>
        <div class="verdict" id="skewVerdict"></div>

        <h4>小文件生成器</h4>
        <div class="slider-row"><span class="name">写出数据量</span><input type="range" id="ogb" min="1" max="100" value="10"><span class="val" id="vogb">10 GB</span></div>
        <div class="slider-row"><span class="name">写出分区数（Task 数）</span><input type="range" id="op" min="1" max="2000" value="200"><span class="val" id="vop">200</span></div>
        <div class="verdict" id="fileVerdict"></div>
      `
      const N = 10
      const gantt = el.querySelector('#gantt') || el.querySelector('#skewGantt')
      const SCALE = 120 // 满负载 = 120 min
      function rows(shares, labelFn) {
        return shares.map((s, i) => {
          const t = Math.round(s * SCALE)
          const hot = s * N > 2.5
          return `<div class="gantt-row"><span class="gantt-lbl">${labelFn(i)}</span><div class="gantt-track"><div class="gantt-fill" style="width:0;left:0;background:${hot ? 'var(--fail)' : 'var(--ok)'}" data-w="${s}"></div></div><span class="bar-val">${t} min</span></div>`
        }).join('')
      }
      function animateIn() {
        const max = +([...gantt.querySelectorAll('.gantt-fill')].map(f => f.dataset.w).sort((a, b) => b - a)[0] || 1)
        gantt.querySelectorAll('.gantt-fill').forEach((f, i) => {
          later(() => { f.style.width = (f.dataset.w / max * 100) + '%' }, 80 + i * 40)
        })
        return max
      }
      function drawSkew(salted) {
        const skew = +el.querySelector('#skew').value
        el.querySelector('#vskew').textContent = skew + '%'
        const v = el.querySelector('#skewVerdict')
        if (!salted) {
          const hot = skew / 100, rest = (1 - hot) / (N - 1)
          const shares = [hot, ...Array(N - 1).fill(rest)]
          gantt.innerHTML = `<div style="font-size:.72rem;color:var(--muted);font-weight:700;margin-bottom:4px">单阶段聚合（groupBy 直接 Shuffle）</div>` + rows(shares, i => 'Task ' + i)
          const max = animateIn()
          const total = Math.round(max * SCALE), other = Math.round(rest * SCALE)
          if (skew >= 30) { v.className = 'verdict bad'; v.innerHTML = `倾斜中：Task 0 扛走 ${skew}% 数据，需 <b>${total} min</b>；其余 Task 仅 ${other} min——它们早早跑完，集群空转等你。<b>Job 总耗时 = ${total} min</b>。` }
          else { v.className = 'verdict ok'; v.innerHTML = `分布基本均匀，Job 总耗时 ≈ ${total} min，无需处理。` }
        } else {
          const hot = skew / 100 / N
          const rest = (1 - skew / 100) / N
          const phA = Array(N).fill(0).map(() => rest + hot)
          const phB = Array(N).fill(0).map((_, i) => 0.06 + (i === 0 ? 0.02 : 0))
          const maxA = Math.max(...phA), maxB = Math.max(...phB)
          gantt.innerHTML =
            `<div style="font-size:.72rem;color:var(--run);font-weight:700;margin-bottom:4px">阶段 A：热点 key 加随机前缀（拆成 10 份）→ 预聚合</div>` +
            rows(phA, i => 'Task A' + i) +
            `<div style="border-top:2px dashed var(--fail);margin:8px 0 2px;font-size:.72rem;color:var(--fail);font-weight:700">Shuffle（代价：多这一次）</div>` +
            `<div style="font-size:.72rem;color:var(--run);font-weight:700;margin:4px 0">阶段 B：去掉前缀，二次聚合</div>` +
            rows(phB, i => 'Task B' + i)
          const maxWall = Math.max(maxA, maxB)
          // 宽度统一按墙钟归一
          gantt.querySelectorAll('.gantt-fill').forEach((f, i) => {
            later(() => { f.style.width = (f.dataset.w / maxWall * 100) + '%' }, 80 + i * 30)
          })
          const oldTotal = Math.round(skew / 100 * SCALE)
          const newTotal = Math.round((maxA + maxB) * SCALE)
          v.className = 'verdict ok'
          v.innerHTML = `加盐后：热点被拆到 ${N} 个 Task 并行，<b>Job 总耗时 ${oldTotal} → ${newTotal} min</b>。代价：多一次 Shuffle + 代码多一步去盐。Spark 3.x 可开 <code>spark.sql.adaptive.skewJoin.enabled</code> 让 AQE 自动做类似拆分。`
        }
      }
      el.querySelector('#skew').oninput = () => { clearTimers(); drawSkew(false) }
      el.querySelector('#salt').onclick = () => { clearTimers(); drawSkew(true) }
      el.querySelector('#resetSkew').onclick = () => { clearTimers(); drawSkew(false) }
      drawSkew(false)

      const fileCalc = () => {
        const gb = +el.querySelector('#ogb').value, p = +el.querySelector('#op').value
        el.querySelector('#vogb').textContent = gb + ' GB'
        el.querySelector('#vop').textContent = p
        const per = gb * 1024 / p
        const v = el.querySelector('#fileVerdict')
        if (per < 32) { v.className = 'verdict bad'; v.innerHTML = `<b>${p} 个文件 × ${per.toFixed(1)}MB</b>：小文件灾难！NameNode 元数据爆炸、下游查询要打开 ${p} 次文件。解法：写出前 <code>repartition(N)</code> 或开 AQE 合并。` }
        else if (per <= 512) { v.className = 'verdict ok'; v.innerHTML = `<b>${p} 个文件 × ${per.toFixed(0)}MB</b>：健康（128~256MB/文件最省心）。` }
        else { v.className = 'verdict warn'; v.innerHTML = `<b>${p} 个文件 × ${per.toFixed(0)}MB</b>：单文件偏大，读取并行度可能不足。` }
      }
      el.querySelector('#ogb').oninput = fileCalc
      el.querySelector('#op').oninput = fileCalc
      fileCalc()
    }

    /* ============ 09 Watermark 模拟器（自动播放） ============ */
    function render09(el) {
      el.innerHTML = `
        <h2>Watermark：流处理怎么处理「迟到的数据」？</h2>
        <p class="lead">事件按「事件时间」落进 5 分钟窗口；Watermark = 已见最大事件时间 − 10 分钟，<b>是引擎对「数据大概到齐了」的估计</b>。点推进或自动播放，看窗口何时输出、迟到数据的两种命运。</p>
        <div class="toolbar"><button class="primary" id="adv">推进一批</button><button id="auto">▶ 自动播放</button><button id="reset">重置</button><span class="phase" id="wmInfo"></span></div>
        <div class="timeline" id="tl"></div>
        <div class="win-grid" id="wins"></div>
        <div class="verdict info" id="wmDetail">窗口在 Watermark 越过其结束时间后才输出；比 Watermark 还迟到的数据被丢弃（红点）。</div>

        <h4>输出模式 × 查询类型（点击格子看原因）</h4>
        <table class="matrix" id="mx">
          <tr><th></th><th>append</th><th>update</th><th>complete</th></tr>
        </table>
        <div class="verdict info" id="mxDetail">点击矩阵格子查看为什么。</div>
      `
      const W = 5, LAG = 10, MAXT = 30
      const events = [
        { et: 2, b: 1 }, { et: 4, b: 1 }, { et: 7, b: 1 },
        { et: 9, b: 2 }, { et: 12, b: 2 }, { et: 15, b: 2 },
        { et: 6, b: 3, late: true },   // 迟到但 watermark 未越过其窗口 → 仍接收
        { et: 17, b: 3 }, { et: 19, b: 3 }, { et: 22, b: 3 },
        { et: 8, b: 4, late: true },   // 严重迟到 → 丢弃
        { et: 24, b: 4 }, { et: 27, b: 4 },
      ]
      let batch = 0, autoTimer = null
      const tl = el.querySelector('#tl'), wins = el.querySelector('#wins'), info = el.querySelector('#wmInfo')
      const x = (t) => 20 + (t / MAXT) * ((tl.clientWidth || 800) - 40)
      function draw() {
        const arrived = events.filter(e => e.b <= batch)
        const maxEt = arrived.length ? Math.max(...arrived.map(e => e.et)) : 0
        const wm = Math.max(0, maxEt - LAG)
        info.textContent = batch ? `已到达 ${arrived.length} 条 · 最大事件时间 ${maxEt} 分 · Watermark = ${wm} 分` : ''
        let dots = ''
        arrived.forEach(e => {
          const dropped = e.et < wm && e.late
          const cls = dropped ? 'late' : (e.et < wm ? 'done' : '')
          dots += `<div class="ev ${cls}" style="left:${x(e.et)}px" title="事件时间=${e.et}分 ${dropped ? '迟到丢弃' : '已接收'}"></div>`
        })
        tl.innerHTML = `<div class="tl-axis"></div>` +
          [0, 5, 10, 15, 20, 25, 30].map(t => `<span class="tl-tick" style="left:${x(t)}px">${t}分</span>`).join('') +
          dots +
          (batch ? `<div class="wm-line" style="left:${x(wm)}px"><span class="wm-tag">WM ${wm}</span></div>` : '')
        let cells = '', openCnt = 0
        for (let s = 0; s < MAXT; s += W) {
          const end = s + W
          const inWin = arrived.filter(e => e.et >= s && e.et < end && !(e.et < wm && e.late))
          const closed = batch > 0 && end <= wm
          if (!closed && batch > 0 && inWin.length) openCnt++
          cells += `<div class="win-cell ${closed ? 'closed' : (batch ? 'open' : '')}">[${s}-${end})<br>${closed ? '已输出: ' + inWin.length : (batch ? '计数中: ' + inWin.length : '—')}</div>`
        }
        wins.innerHTML = cells
        const detail = el.querySelector('#wmDetail')
        if (batch === 3) detail.innerHTML = '注意：<b>事件时间=6 的事件迟到了</b>，但 Watermark（12）还没越过窗口 [5-10) 的结束时间 10 → <b>仍被接收</b>，窗口继续计数。'
        else if (batch === 4) detail.innerHTML = '注意：<b>事件时间=8 的事件严重迟到</b>，Watermark（17）已越过窗口 [5-10) → <b>被丢弃（红点）</b>。窗口已关闭输出，状态被清理，内存释放。'
        else if (batch) detail.innerHTML = `状态中维护的窗口数 ≈ ${openCnt || 1} 个；窗口一关闭，状态立即清理——这就是 Watermark 的第二个作用：<b>防止状态无限膨胀</b>。`
      }
      el.querySelector('#adv').onclick = () => { if (batch < 4) { batch++; draw() } }
      el.querySelector('#auto').onclick = (e) => {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; e.target.textContent = '▶ 自动播放'; return }
        e.target.textContent = '⏸ 暂停'
        autoTimer = setInterval(() => {
          if (batch >= 4) { clearInterval(autoTimer); autoTimer = null; el.querySelector('#auto').textContent = '▶ 自动播放'; return }
          batch++; draw()
        }, 1100)
        timers.push(autoTimer)
      }
      el.querySelector('#reset').onclick = () => { batch = 0; if (autoTimer) { clearInterval(autoTimer); autoTimer = null; el.querySelector('#auto').textContent = '▶ 自动播放' } draw() }
      draw()
      later(draw, 120)

      const rows = [
        ['无聚合（map/filter）', { append: '✔ 默认。每来一条出一条，结果不再变化。', update: '可用但无意义（没有可更新的结果）。', complete: '❌ 不允许：全量结果表无限增长。' }],
        ['聚合 + watermark 窗口', { append: '✔ 窗口关闭后才输出，输出即不再变。', update: '✔ 窗口未关时持续更新计数。', complete: '✔ 每批输出全部窗口（适合小结果集）。' }],
        ['聚合但无 watermark', { append: '❌ 不允许：旧 key 的结果随时会变，违背 append 语义。', update: '✔ 只输出有变化的 key。', complete: '✔ 每批输出全量结果表（状态无限膨胀风险）。' }],
      ]
      const mx = el.querySelector('#mx')
      rows.forEach(([q, m]) => {
        const tr = document.createElement('tr')
        tr.innerHTML = `<th style="text-align:left">${q}</th>` + ['append', 'update', 'complete'].map(k => `<td class="cell" data-t="${m[k]}">${m[k].slice(0, 1)}</td>`).join('')
        tr.querySelectorAll('.cell').forEach(td => td.onclick = () => {
          el.querySelector('#mxDetail').className = 'verdict ' + (td.dataset.t.startsWith('❌') ? 'bad' : 'ok')
          el.querySelector('#mxDetail').textContent = td.dataset.t
        })
        mx.appendChild(tr)
      })
    }

    /* ============ 10 决策树 ============ */
    function render10(el) {
      el.innerHTML = `
        <h2>Spark 还是 Flink？决策树</h2>
        <p class="lead">实时选型是新人最容易纠结的问题。回答几个问题，给出建议。</p>
        <div class="toolbar" id="tree"></div>
        <div class="verdict info" id="treeDetail">点「开始」。</div>
        <div class="concl">一句话选型：<b>离线数仓 / SQL / ML 选 Spark；亚秒级延迟、复杂状态流选 Flink</b>。国内常见「Spark 离线 + Flink 实时」并存。湖仓格式（Delta / Iceberg / Hudi）解决的是对象存储上的 ACID 与 Schema 演进，与引擎正交——细节见笔记。</div>
      `
      const tree = [
        { q: '需要亚秒级（毫秒）延迟，或复杂事件处理 CEP？', yes: 1, no: 2 },
        { q: '需要强状态/大状态、Savepoint 精准控制？', yes: 'flink', no: 3 },
        { q: '团队已有 Spark 栈，以离线为主、实时为辅？', yes: 'spark', no: 4 },
        { q: '需要 MLlib / 图计算 / 成熟湖仓生态？', yes: 'spark', no: 'both' },
      ]
      const verdicts = {
        flink: ['ok', '建议 Flink：原生流、毫秒延迟、状态管理是强项。'],
        spark: ['ok', '建议 Spark：离线数仓/SQL/ML 生态最成熟，流式用 Structured Streaming（秒级微批）即可。'],
        both: ['info', '两者均可，按团队技术栈与已有基建选择。'],
      }
      let ti = -1
      const treeBox = el.querySelector('#tree'), td = el.querySelector('#treeDetail')
      function step(ans) {
        if (ans !== undefined) {
          const r = tree[ti][ans]
          if (typeof r === 'string') {
            td.className = 'verdict ' + verdicts[r][0]
            td.textContent = verdicts[r][1]
            treeBox.innerHTML = '<button id="again">重新开始</button>'
            el.querySelector('#again').onclick = () => step('reset')
            return
          }
          ti = r
        } else ti = 0
        treeBox.innerHTML = `<span>${tree[ti].q}</span><button class="primary" id="y">是</button><button id="n">否</button>`
        td.className = 'verdict info'; td.textContent = '回答上方问题…'
        el.querySelector('#y').onclick = () => step('yes')
        el.querySelector('#n').onclick = () => step('no')
      }
      treeBox.innerHTML = '<button class="primary" id="tstart">开始</button>'
      el.querySelector('#tstart').onclick = () => step()
    }

    const renders = {
      '01': render01, '02': render02, '03': render03, '04': render04, '05': render05,
      '06': render06, '07': render07, '08': render08, '09': render09, '10': render10,
    }

    show(current in renders ? current : '01')
  </script>
</body>
</html>
