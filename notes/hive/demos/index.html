<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apache Hive · 交互式演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #16202e;
      --muted: #5f6b7a;
      --line: rgba(22, 32, 46, 0.11);
      --brand: #1d4ed8;
      --brand-soft: rgba(29, 78, 216, 0.1);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
      --c0: #1d4ed8; --c1: #0f766e; --c2: #15803d; --c3: #7c3aed; --c4: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 880px) {
      .app { grid-template-columns: 210px 1fr; align-items: start; }
    }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav {
        flex-direction: column;
        position: sticky; top: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }
    }
    .nav button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.86rem;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      white-space: nowrap;
    }
    @media (min-width: 880px) {
      .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; }
      .nav button:hover { background: #f1f5fb; }
    }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 22px;
      min-height: 440px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 18px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fafcff;
    }
    .card h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .arch { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; }
    .arch-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .2s, transform .2s;
      background: #fff;
    }
    .arch-item:hover, .arch-item.on { border-color: var(--brand); transform: translateY(-1px); }
    .arch-item strong { display: block; margin-bottom: 4px; }
    .arch-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .detail {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 3.2em;
    }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .chip {
      border: none;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.ghost { background: #eef2f8; color: var(--muted); font-weight: 500; }
    .chip:hover { filter: brightness(0.97); }
    .arrow { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .toolbar .val { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; color: var(--brand); font-weight: 700; min-width: 3.5em; }
    .log {
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #16202e;
      color: #e5eaf1;
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .log .hot { color: #fb923c; }
    .log .ok { color: #86efac; }
    .log .blue { color: #60a5fa; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #f4f6fa;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .bar-row .lbl { width: 64px; color: var(--muted); flex: none; }
    .bar-track { flex: 1; background: #eaeef5; border-radius: 6px; height: 17px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .5s ease; }
    .bar-fill.hot { background: var(--fail); }
    .bar-fill.good { background: var(--ok); }
    .bar-val { width: 90px; flex: none; color: var(--muted); }
    .faq-q {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .faq-q:hover { border-color: var(--brand); }
    .faq-a {
      margin: 4px 0 4px;
      padding: 8px 12px;
      border-left: 3px solid var(--brand);
      background: var(--brand-soft);
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 180px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 100px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; text-align: right; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .kv { font-size: 0.85rem; line-height: 1.85; }
    .kv b { color: var(--brand); font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.75rem; background: #eef2f8; color: var(--muted); }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .pill.bad { background: #fee2e2; color: var(--fail); }
    .pill.warn { background: #fef3c7; color: var(--warn); }

    /* 数仓分层专用 */
    .dw-layer {
      display: grid; gap: 8px; grid-template-columns: 1fr;
      margin-top: 8px;
    }
    @media (min-width: 700px) { .dw-layer { grid-template-columns: 1fr 1fr 1fr 1fr; } }
    .dw-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fafcff;
      cursor: pointer;
      transition: border-color .2s, transform .2s;
    }
    .dw-box:hover, .dw-box.on { border-color: var(--brand); transform: translateY(-1px); }
    .dw-box h5 { margin: 0 0 4px; font-size: 0.9rem; color: var(--brand); }
    .dw-box p { margin: 0; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .dw-box .dir { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: var(--ink); margin-top: 6px; }

    /* 架构专用 */
    .arch-flow {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      background: #fafcff; margin-top: 8px;
    }
    .arch-node {
      border: 1px solid var(--brand);
      background: var(--brand-soft);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--brand);
      cursor: pointer;
      text-align: center;
      min-width: 60px;
    }
    .arch-node.on { background: var(--brand); color: #fff; }
    .arch-node.muted { background: transparent; border-color: var(--line); color: var(--muted); }

    /* 存储格式专用 */
    .format-compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 8px; }
    .fmt-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fafcff; cursor: pointer; transition: border-color .2s, transform .2s; }
    .fmt-card:hover, .fmt-card.on { border-color: var(--brand); transform: translateY(-1px); }
    .fmt-card h5 { margin: 0 0 6px; font-size: 0.95rem; color: var(--brand); }
    .fmt-card .tag { display: inline-block; border-radius: 999px; padding: 0.05rem 0.5rem; font-size: 0.72rem; margin-right: 4px; }

    /* 分区裁剪可视化 */
    .part-viz { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 10px; }
    .part-cell {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
      background: #fafcff;
      font-family: ui-monospace, Menlo, monospace;
      text-align: center;
    }
    .part-cell.scanned { background: #fee2e2; border-color: var(--fail); color: var(--fail); font-weight: 600; }
    .part-cell.skipped { background: #dcfce7; border-color: var(--ok); color: var(--ok); }

    /* 执行引擎专用 */
    .engine-compare { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 8px; }
    .engine-card { border: 2px solid var(--line); border-radius: 12px; padding: 14px; background: #fafcff; cursor: pointer; transition: all .2s; text-align: center; }
    .engine-card.on { border-color: var(--brand); background: var(--brand-soft); }
    .engine-card h5 { margin: 0 0 4px; font-size: 1rem; color: var(--brand); }
    .engine-card .speed { font-size: 0.75rem; color: var(--muted); }
    .dag-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #16202e; color: #e5eaf1; font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; margin-top: 10px; }

    /* Compaction 专用 */
    .acid-files { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); margin-top: 10px; }
    .acid-file {
      border: 1.5px solid var(--brand);
      border-radius: 8px;
      padding: 12px 8px;
      font-size: 0.75rem;
      background: var(--brand-soft);
      font-family: ui-monospace, Menlo, monospace;
      text-align: center;
      transition: opacity .3s;
    }
    .acid-file.base { background: #f0fdf4; border-color: var(--ok); color: var(--ok); }
    .acid-file.delta { background: #fef3c7; border-color: var(--warn); color: var(--warn); }
    .acid-file.merged { opacity: 0; }

    /* Metastore 连接图 */
    .ms-hub {
      border: 2px solid var(--brand);
      border-radius: 16px;
      padding: 14px 18px;
      background: var(--brand-soft);
      text-align: center;
      margin: 14px auto;
      max-width: 280px;
    }
    .ms-hub strong { font-size: 1rem; color: var(--brand); }
    .ms-hub p { margin: 4px 0 0; font-size: 0.78rem; color: var(--muted); }
    .ms-clients { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-top: 6px; }
    .ms-client {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      text-align: center;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color .2s, transform .2s;
    }
    .ms-client:hover, .ms-client.on { border-color: var(--brand); transform: translateY(-1px); background: var(--brand-soft); color: var(--brand); font-weight: 600; }

    .env-eco { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .eco-node {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
      text-align: center;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all .2s;
    }
    .eco-node:hover, .eco-node.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }

    .table-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; font-size: 0.82rem; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>Apache Hive 交互演示</h1>
        <p>Metastore + SQL 兼容层。点左侧章节，动手玩概念。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与定位' },
      { id: '02', title: '02 架构与核心组件' },
      { id: '03', title: '03 数据模型与存储格式' },
      { id: '04', title: '04 SQL 与分区管理' },
      { id: '05', title: '05 数仓分层设计' },
      { id: '06', title: '06 执行引擎与 Tez/Spark 切换' },
      { id: '07', title: '07 性能调优' },
      { id: '08', title: '08 ACID 与事务' },
      { id: '09', title: '09 Hive 与周边组件' },
      { id: '10', title: '10 生态对比与 FAQ' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    function show(id) {
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', `?c=${id}`)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述与定位 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>Hive 在大数据链路中的位置</h2>
        <p class="lead">Hive 把「HDFS 上的一堆文件」变成「有名字、有结构的表」，然后让你用 SQL 来查。点下面的引擎/组件卡片看定位。</p>

        <h4>Hive vs Spark SQL vs Trino 对比</h4>
        <div class="arch" id="compCards"></div>
        <div class="detail" id="compD">点击上方卡片。</div>

        <h4>大数据全链路位置图</h4>
        <div class="arch-flow" style="justify-content:center">
          <span class="arch-node muted">数据采集</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node muted">Kafka/Flink CDC</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node">HDFS / 对象存储</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node on" id="hiveNode">Hive（数仓 SQL 层）</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node muted">Spark/Tez/Trino 执行</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node muted">业务报表/BI</span>
        </div>
        <p class="hint">Hive 本身不存数据也不跑计算：<b>数据在 HDFS/对象存储</b>，<b>计算交给 Tez/Spark/Trino</b>，它只做「翻译 SQL + 管理元数据」。</p>

        <h4>Hive vs 传统数仓 vs Spark SQL</h4>
        <table class="tbl">
          <tr><th>维度</th><th>Hive (on Tez)</th><th>传统数仓</th><th>Spark SQL</th></tr>
          <tr><td>存储</td><td>HDFS/对象存储</td><td>DBMS 自有存储</td><td>外部存储</td></tr>
          <tr><td>延迟</td><td>分钟级</td><td>秒级~亚秒级</td><td>秒级</td></tr>
          <tr><td>成本</td><td>低（廉价机器）</td><td>高（专有硬件）</td><td>中</td></tr>
          <tr><td>迭代支持</td><td>无（DAG 一次跑）</td><td>好</td><td>好</td></tr>
          <tr><td>SQL 兼容</td><td>HiveQL 方言</td><td>标准 SQL</td><td>接近标准 SQL</td></tr>
        </table>
      `
      const comps = [
        ['Hive (on Tez/Spark)', '本质是 <b>Metastore + SQL 兼容层</b>。不存数据、不跑计算。数据在 HDFS/对象存储，计算交给 Tez/Spark/Trino。分钟级延迟，数仓建模成熟。'],
        ['Spark SQL', '多模态计算引擎。Catalyst 优化器快，支持 RDD 迭代、MLlib、流处理。可以连 Hive Metastore 直接读写 Hive 表。'],
        ['Trino (Presto)', '亚秒级交互式查询引擎。纯内存列式执行，多数据源联邦查询（Hive + MySQL + Cassandra + ...）。不做长 ETL。'],
        ['ClickHouse', 'OLAP 数据库，自带 MergeTree 存储引擎。单表聚合极快、列存压缩好。适合 ADS 报表层，不擅长复杂 JOIN。'],
        ['HBase', '分布式 KV 数据库。列存、强依赖 ZooKeeper。点查快、高并发写好。不是数仓，不做聚合分析。'],
      ]
      const cc = el.querySelector('#compCards'), cd = el.querySelector('#compD')
      comps.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 30)}…</span>`
        div.onclick = () => {
          cc.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); cd.innerHTML = `<b>${n}</b>：${d}`
        }
        cc.appendChild(div)
      })
    }

    /* ============ 02 架构与核心组件 ============ */
    function render02(el) {
      el.innerHTML = `
        <h2>Hive 架构：从 Client 到 HDFS</h2>
        <p class="lead">点下方每个组件卡片看职责；再看一遍查询完整链路；最后了解 Metastore 三种部署模式。</p>

        <h4>核心组件（点击看职责）</h4>
        <div class="arch" id="archRoles"></div>
        <div class="detail" id="archD">点击上方组件。</div>

        <h4>一次查询的完整链路</h4>
        <div class="toolbar">
          <button class="primary" id="qNext">下一步</button>
          <button id="qReset">重置</button>
          <span class="pill" id="qPhase">未开始</span>
        </div>
        <div class="log" id="qLog">点击「下一步」开始模拟。查询：<code>SELECT COUNT(*) FROM orders WHERE dt='2026-11-01'</code></div>

        <h4>Metastore 三种部署模式对比</h4>
        <div class="flow" id="msModes"></div>
        <div class="detail" id="msModeD" style="min-height:3em">点击上方模式。</div>

    /* ============ 04 SQL 与分区管理 ============ */
    function render04(el) {

      const partitions = []
      for (let m = 10; m <= 11; m++) {
        const days = m === 10 ? 31 : 7
        for (let d = 1; d <= days; d++) {
          partitions.push(`2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`)
        }
      }

      function drawPartitions(shouldScan, label) {
        const viz = el.querySelector('#partViz')
        viz.innerHTML = ''
        let scanned = 0
        partitions.forEach(dt => {
          const isScanned = shouldScan(dt)
          if (isScanned) scanned++
          const cell = document.createElement('div')
          cell.className = 'part-cell ' + (isScanned ? 'scanned' : 'skipped')
          cell.textContent = dt
          cell.title = isScanned ? '被扫描' : '被跳过'
          viz.appendChild(cell)
        })
        const pct = Math.round(scanned / partitions.length * 100)
        const verdict = el.querySelector('#partVerdict')
        verdict.innerHTML = `SQL：<code>${label}</code> → 扫描 <b>${scanned}/${partitions.length}</b> 分区（<b>${pct}%</b>）`
        verdict.className = 'verdict ' + (pct < 20 ? 'ok' : pct < 80 ? 'warn' : 'bad')
      }

      const whereCases = [
        ["dt = '2026-11-03'", dt => dt === '2026-11-03', '✅ 完美裁剪：只扫 1 天'],

        ["substr(dt,1,7) = '2026-11'", () => true, '❌ 函数包裹分区键 → 全分区扫描！'],
        ["dt LIKE '2026-11-%'", dt => dt.startsWith('2026-11'), '⚠️ 4.x 能识别 LIKE pattern 前缀，但老版本不行'],
        ["WHERE 里没有 dt", () => true, '❌ 没有分区键 → 全表扫描（38 个分区）'],
      ]
      const wc = el.querySelector('#whereChoices')
      whereCases.forEach(([sql, fn, note]) => {
        const b = document.createElement('button')
        b.className = 'chip ghost'; b.type = 'button'

          wc.querySelectorAll('.chip').forEach(x => x.classList.add('ghost'))
          b.classList.remove('ghost')

      setTimeout(() => wc.querySelector('button').click(), 30)

      const pmCodes = {
        Static: `-- 静态分区：分区值在 PARTITION() 里写死

SELECT order_id, user_id, amount, pay_status
FROM ods_order WHERE dt='2026-11-03';

-- 特点：一次写一个分区，SQL 里 PARTITION 值硬编码`,
        Dynamic: `-- 动态分区：SELECT 最后一列自动作为分区值
SET hive.exec.dynamic.partition=true;
SET hive.exec.dynamic.partition.mode=nonstrict;

INSERT OVERWRITE TABLE dwd_order PARTITION (dt)
SELECT order_id, user_id, amount, pay_status, dt
FROM ods_order WHERE dt BETWEEN '2026-11-01' AND '2026-11-07';

-- 特点：一次写多个分区，自动按最后一列分区`,
        Both: `-- 混合（最常见）：静态分区固定一部分，动态填另一部分
INSERT OVERWRITE TABLE dwd_order PARTITION (year='2026', month='11', day)
SELECT order_id, user_id, amount, dt
FROM ods_order WHERE dt LIKE '2026-11-%';

-- 特点：year/month 静态写死，day 动态生成`,
      }
      function showPM(key) {
        Object.keys(pmCodes).forEach(k => el.querySelector('#pm' + k)?.classList.add('ghost'))
        el.querySelector('#pm' + key)?.classList.remove('ghost')
        el.querySelector('#pmCode').textContent = pmCodes[key]
      }
      Object.keys(pmCodes).forEach(k => {
        el.querySelector('#pm' + k).onclick = () => showPM(k)
      })
      showPM('Static')

      el.querySelector('#expRun').onclick = () => {
        const out = el.querySelector('#expOut')
        out.innerHTML = `<span class="blue">-- ✅ 分区裁剪生效（dt = '2026-11-03'）--</span>
EXPLAIN SELECT COUNT(*) FROM dwd_order WHERE dt='2026-11-03';
...
Partition Specs: [(dt='2026-11-03')]     <span class="ok">← 只扫这一个分区</span>
Stage-0: Map → Reduce
  Map Operator Tree: ... FileScan ORC ... Partition Pruning Done

        <h4>组件定位矩阵</h4>
        <div class="env-eco" id="ecoPos"></div>
        <div class="detail" id="ecoPosD" style="min-height:3em">点击上方组件。</div>

        <h4>2026 主流架构组合</h4>
        <div class="code">实时链路：  Kafka → Flink → Iceberg/Hudi（CDC Upsert）→ Trino/ClickHouse 查询
批量链路：  Hive on Tez / Spark ETL → Iceberg 格式 → Trino 查询 / ClickHouse ADS
BI 报表：   ClickHouse（ADS 层）→ Grafana / 内部 BI 工具

全部共享：Hive Metastore（元数据中心） + HDFS / 对象存储（开放存储）</div>

        <h4>十大面试 FAQ（点击展开）</h4>
        <div id="faqBox"></div>
      `
      const ecos = [
        ['Hive', '数仓 SQL 层 + <b>Metastore</b>。ETL 主力，成熟稳定。自身不存数据也不跑计算。'],
        ['Spark SQL', '多模态计算引擎（批/流/ML/图）。Catalyst 优化快，迭代支持好。可连 Hive Metastore。'],
        ['Trino', '亚秒级交互式查询引擎。纯内存列式 Pipeline，多数据源联邦。不做长 ETL。'],
        ['ClickHouse', 'OLAP 数据库（MergeTree 存储）。单表聚合极快，适合 ADS 报表层。'],
        ['Flink', '流处理引擎。Flink CDC + Iceberg/Hudi 是实时湖仓一体的核心。'],
        ['Iceberg', '湖仓<b>表格式</b>（不是引擎）。ORC/Parquet/Avro 都支持。时间旅行、Schema 演进。'],
        ['Hudi', 'Uber 开源湖仓表格式。MOR Upsert 强。增量拉取强。'],
        ['Delta', 'Databricks 湖仓表格式。Spark 原生最完善。ZORDER OPTIMIZE。'],
      ]
      const ep = el.querySelector('#ecoPos'), epd = el.querySelector('#ecoPosD')
      ecos.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'eco-node'
        div.innerHTML = n
        div.onclick = () => {
          ep.querySelectorAll('.eco-node').forEach(x => x.classList.remove('on'))
          div.classList.add('on')
          epd.innerHTML = `<b>${n}</b>：${d}`
        }
        ep.appendChild(div)
      })

      const faqs = [
        ['Hive 和 HDFS 是什么关系？', 'HDFS 是分布式文件系统（存文件），Hive 是 SQL 层（把文件映射成表）。Hive 的数据全在 HDFS 上，Hive 本身只存元数据（Metastore 数据库里）。'],
        ['Hive 和 Spark 是什么关系？', 'Spark 是多模态计算引擎，可以直接连 Hive Metastore 读 Hive 表。Spark SQL 兼容 HiveQL 语法，两者共享元数据。Hive on Spark 让 HiveQL 翻译成 Spark 物理计划执行。'],
        ['分区裁剪原理？什么时候不会触发？', 'WHERE 条件里的分区键必须能用等值/IN/BETWEEN 等静态判断。substr(dt,1,7)、函数包裹、LIKE 旧版本、子查询等值等会让裁剪失效。用 EXPLAIN 看 Partition Specs 确认。'],
        ['MapJoin 和 ReduceJoin 区别？', 'MapJoin 把小表（≤25–50MB）广播到所有 Map 端本地 JOIN，**无 Shuffle**，只支持等值 JOIN。ReduceJoin 两边按 key Shuffle，Reduce 端合并，适合大表×大表。自动 MapJoin 默认开启。'],
        ['Hive ACID 怎么实现？', '三个必要条件：ORC 文件格式（有 Delta 目录 + Footer 元数据）× Bucket 分桶表（物理集中）× Compaction（Base + Delta 后台合并）。通过 Delta 目录记录变更，查询时自动 merge。'],
        ['Metastore 远程 vs 本地模式？', '本地模式 Metastore 和 HS2 同进程，HS2 挂了元数据也不可用。远程模式 Metastore 独立进程（端口 9083），Spark/Flink/Trino 可直连，生产推荐。'],
        ['Hive on Tez 和 Hive on Spark 哪个快？', '简单聚合 Tez 快（AM 常驻 + DAG 紧凑）；多次 JOIN / 大表 Shuffle 且有小表广播时 Spark Catalyst 可能更快。实测为准。'],
        ['湖仓一体对 Hive 的影响？', '湖仓表格式（Iceberg/Hudi/Delta）取代 Hive 原生 ORC 表的文件层，Hive Metastore 成为共享的 Catalog 后端。Hive 回归「Metastore + SQL 兼容层」定位。'],
        ['拉链表是什么？SCD Type 2？', '拉链表记录维度的历史状态变迁。SCD Type 2 核心是 start_date / end_date 两个字段标记版本区间（当前版本 end_date=9999-12-31）。查历史用 dt >= start_date AND dt <= end_date。'],
        ['怎么选 Hive vs Spark vs Trino vs ClickHouse？', 'Hive on Tez/Spark 做 ETL、Spark SQL 做 ML、Trino 做交互式查询、ClickHouse 做 ADS 报表。混合架构是主流：Hive Metastore 当中心 + Iceberg 当表格式 + 多引擎共享。'],
      ]
      const fBox = el.querySelector('#faqBox')
      faqs.forEach(([q, a], i) => {
        const b = document.createElement('button')
        b.className = 'faq-q'
        b.innerHTML = `Q${i + 1}. ${q}`
        const ans = document.createElement('div')
        ans.className = 'faq-a hidden'
        ans.textContent = a
        b.onclick = () => { ans.classList.toggle('hidden') }
        fBox.appendChild(b)
        fBox.appendChild(ans)
      })
    }

    }
