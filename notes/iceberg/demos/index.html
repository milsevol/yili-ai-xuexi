<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apache Iceberg · 交互式演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #16202e;
      --muted: #5f6b7a;
      --line: rgba(22, 32, 46, 0.11);
      --brand: #1d4ed8;
      --brand-soft: rgba(29, 78, 216, 0.1);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
      --c0: #1d4ed8; --c1: #0f766e; --c2: #15803d; --c3: #7c3aed; --c4: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
    @media (min-width: 880px) { .app { grid-template-columns: 210px 1fr; align-items: start; } }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav {
        flex-direction: column; position: sticky; top: 12px;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 14px; padding: 10px;
      }
    }
    .nav button {
      border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
      padding: 0.45rem 0.85rem; font-size: 0.86rem; cursor: pointer;
      text-align: left; color: var(--ink); white-space: nowrap;
    }
    @media (min-width: 880px) {
      .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; }
      .nav button:hover { background: #f1f5fb; }
    }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 22px; min-height: 440px; }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 18px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .grid3 { display: grid; gap: 10px; }
    @media (min-width: 700px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fafcff; }
    .card h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .arch { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; }
    .arch-item {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      cursor: pointer; transition: border-color .2s, transform .2s; background: #fff;
    }
    .arch-item:hover, .arch-item.on { border-color: var(--brand); transform: translateY(-1px); }
    .arch-item strong { display: block; margin-bottom: 4px; }
    .arch-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .detail {
      margin-top: 12px; padding: 12px 14px; border-radius: 10px;
      background: var(--brand-soft); color: var(--ink); font-size: 0.9rem;
      line-height: 1.6; min-height: 3.2em;
    }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .chip {
      border: none; border-radius: 999px; padding: 0.35rem 0.75rem;
      background: var(--brand-soft); color: var(--brand); font-size: 0.82rem;
      font-weight: 600; cursor: pointer;
    }
    .chip.ghost { background: #eef2f8; color: var(--muted); font-weight: 500; }
    .chip:hover { filter: brightness(0.97); }
    .arrow { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 0.4rem 0.75rem; font-size: 0.85rem; cursor: pointer;
    }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .toolbar .val { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; color: var(--brand); font-weight: 700; min-width: 3.5em; }
    .log {
      margin-top: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; line-height: 1.55; background: #16202e; color: #e5eaf1;
      border-radius: 10px; padding: 10px 12px; max-height: 260px; overflow: auto; white-space: pre-wrap;
    }
    .log .hot { color: #fb923c; }
    .log .ok { color: #86efac; }
    .log .blue { color: #60a5fa; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem;
      line-height: 1.55; background: #f4f6fa; border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .bar-row .lbl { width: 64px; color: var(--muted); flex: none; }
    .bar-track { flex: 1; background: #eaeef5; border-radius: 6px; height: 17px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .5s ease; }
    .bar-fill.hot { background: var(--fail); }
    .bar-fill.good { background: var(--ok); }
    .bar-val { width: 90px; flex: none; color: var(--muted); }
    .faq-q {
      width: 100%; text-align: left; border: 1px solid var(--line); background: #fff;
      border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; cursor: pointer; margin-top: 8px;
    }
    .faq-q:hover { border-color: var(--brand); }
    .faq-a {
      margin: 4px 0 4px; padding: 8px 12px; border-left: 3px solid var(--brand);
      background: var(--brand-soft); border-radius: 0 8px 8px 0; font-size: 0.85rem; line-height: 1.6;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 180px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 100px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; text-align: right; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .kv { font-size: 0.85rem; line-height: 1.85; }
    .kv b { color: var(--brand); font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.75rem; background: #eef2f8; color: var(--muted); }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .pill.bad { background: #fee2e2; color: var(--fail); }
    .pill.warn { background: #fef3c7; color: var(--warn); }

    /* 01 三代对比 */
    .era-card { border: 2px solid var(--line); border-radius: 12px; padding: 14px; background: #fafcff; cursor: pointer; transition: all .2s; }
    .era-card.on { border-color: var(--brand); background: var(--brand-soft); }
    .era-card h5 { margin: 0 0 6px; font-size: 0.98rem; color: var(--brand); }
    .era-card p { margin: 0; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .pain-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; cursor: pointer; margin-top: 6px; }
    .pain-item:hover, .pain-item.on { border-color: var(--brand); background: var(--brand-soft); }
    .pain-item strong { font-size: 0.88rem; }
    .pain-item span { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 3px; }

    /* 02 元数据五层 */
    .meta-stack { display: grid; gap: 8px; margin-top: 10px; }
    .meta-layer {
      border: 1px solid var(--line); border-left: 4px solid var(--brand);
      border-radius: 10px; padding: 10px 12px; background: #fafcff; cursor: pointer; transition: all .2s;
    }
    .meta-layer:hover, .meta-layer.on { background: var(--brand-soft); transform: translateX(3px); }
    .meta-layer strong { font-size: 0.9rem; }
    .meta-layer span { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .snap-tree { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    .snap-node { border: 1px solid var(--brand); background: var(--brand-soft); color: var(--brand); border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; font-family: ui-monospace, Menlo, monospace; cursor: pointer; }
    .snap-node.on { background: var(--brand); color: #fff; }
    .snap-line { color: var(--muted); }

    /* 03 manifest 裁剪 */
    .file-grid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 10px; }
    .file-box { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 0.72rem; font-family: ui-monospace, Menlo, monospace; background: #fafcff; line-height: 1.4; }
    .file-box.scanned { border-color: var(--fail); background: #fef2f2; }
    .file-box.skipped { border-color: var(--ok); background: #f0fdf4; opacity: .65; }
    .file-box b { display: block; color: var(--ink); margin-bottom: 2px; }

    /* 04 并发写 */
    .writer-row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-top: 10px; }
    .writer-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fafcff; font-size: 0.8rem; line-height: 1.5; }
    .writer-box.win { border-color: var(--ok); background: #f0fdf4; }
    .writer-box.lose { border-color: var(--fail); background: #fef2f2; }
    .pointer-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; }
    .ptr { border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; }
    .ptr.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 700; }

    /* 05 分区 */
    .part-opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .spec-row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: #fafcff; font-size: 0.82rem; }
    .spec-row.new { border-color: var(--ok); background: #f0fdf4; }
    .dir-list { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: var(--muted); margin-top: 6px; line-height: 1.6; }

    /* 06 时间轴 */
    .timeline { display: flex; gap: 4px; align-items: center; margin: 12px 0; }
    .tl-dot { flex: 1; height: 8px; border-radius: 4px; background: #dbe3ef; }
    .tl-dot.on { background: var(--brand); }
    .tl-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 8px; }
    .data-table td, .data-table th { border-bottom: 1px dashed var(--line); padding: 6px 8px; text-align: left; }

    /* 07 列 ID */
    .schema-row { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; font-size: 0.8rem; font-family: ui-monospace, Menlo, monospace; background: #fafcff; }
    .schema-row.changed { border-color: var(--brand); background: var(--brand-soft); }

    /* 08 集成 */
    .eco-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); margin-top: 8px; }
    .eco-node { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; text-align: center; font-size: 0.82rem; cursor: pointer; transition: all .2s; }
    .eco-node:hover, .eco-node.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }

    /* 09 小文件 */
    .small-files { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); margin-top: 10px; }
    .sf { height: 34px; border-radius: 6px; background: #dbeafe; border: 1px solid #93c5fd; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; color: #1e40af; font-family: ui-monospace, Menlo, monospace; transition: all .3s; }
    .sf.big { background: #dcfce7; border-color: #86efac; color: var(--ok); font-weight: 700; }
    .sf.fade { opacity: 0; transform: scale(.6); }

    /* 10 对比大表 */
    .cmp { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 8px; }
    .cmp th, .cmp td { border: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
    .cmp th { background: #f4f6fa; color: var(--muted); }
    .cmp tr:nth-child(even) td { background: #fafcff; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>Apache Iceberg 交互演示</h1>
        <p>开放表格式 = 元数据树 + 快照。点左侧章节，动手玩概念。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与湖仓一体' },
      { id: '02', title: '02 架构与元数据层级' },
      { id: '03', title: '03 表格式与文件组织' },
      { id: '04', title: '04 ACID 与快照隔离' },
      { id: '05', title: '05 分区演进与隐藏分区' },
      { id: '06', title: '06 Time Travel 与版本管理' },
      { id: '07', title: '07 Schema 演进与数据类型' },
      { id: '08', title: '08 与 Spark/Flink/Hive 集成' },
      { id: '09', title: '09 性能优化与实践' },
      { id: '10', title: '10 生态对比与 FAQ' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    function show(id) {
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', '?c=' + id)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述与湖仓一体 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>为什么要湖仓一体</h2>
        <p class="lead">数据湖便宜但没事务，数仓有事务但贵且封闭。湖仓一体 = 对象存储 + 开放表格式 + 多引擎。点卡片看差异。</p>

        <h4>三代架构（点击看特点）</h4>
        <div class="grid3" id="eraCards"></div>
        <div class="detail" id="eraD">点击上方卡片。</div>

        <h4>Hive 表的四大痛点（点击看 Iceberg 的解法）</h4>
        <div id="painList"></div>
        <div class="detail" id="painD">点击上方痛点。</div>

        <h4>Iceberg / Hudi / Delta 怎么选</h4>
        <div class="flow" id="cmpChips"></div>
        <div class="detail" id="cmpD" style="min-height:3em">点击上方格式。</div>

        <h4>Iceberg 表的最小结构</h4>
        <div class="code">data/          ← Parquet 数据文件（默认 128MB）
metadata/
  00003.metadata.json   ← Schema + 分区 spec + 快照列表
  snap-xxx.avro         ← Manifest List（快照的所有 Manifest）
  xxx-m0.avro           ← Manifest（一批 Data File + 每列 min/max）
Catalog                ← 只存「表名 → metadata.json 路径」的指针</div>
      `
      const eras = [
        ['数据湖（Hive 表）', '廉价存储 + 裸文件。没有 ACID、没有版本、分区就是目录。适合存原始数据和算法样本，不适合直接做数仓。'],
        ['数据仓库', '专有存储 + 完整事务 + 优化器。体验好但成本高、格式封闭、存算耦合，数据规模一大就贵。'],
        ['湖仓一体（Iceberg）', '对象存储 + 开放表格式 + 多引擎。既有数据湖的成本，又有数仓的 ACID、Schema 演进和 Time Travel。'],
      ]
      const ec = el.querySelector('#eraCards'), ed = el.querySelector('#eraD')
      eras.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'era-card'
        div.innerHTML = '<h5>' + n + '</h5><p>' + d.slice(0, 26) + '…</p>'
        div.onclick = () => {
          ec.querySelectorAll('.era-card').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); ed.innerHTML = '<b>' + n + '</b>：' + d
        }
        ec.appendChild(div)
      })

      const pains = [
        ['无 ACID', '不能行级 UPDATE/DELETE，并发写互相覆盖，失败留下脏文件。', 'Iceberg：不可变文件 + 快照隔离 + v2 delete file，支持 MERGE/UPDATE/DELETE。'],
        ['分区演进难', '分区是物理目录，天改小时要重写全表，SQL 还必须写分区列。', 'Iceberg：隐藏分区 + partition spec 演进，历史数据不重写，查询只写业务列。'],
        ['小文件', '流式/微批产出海量小文件，Hive 没有内建合并，查询 open 开销爆炸。', 'Iceberg：写入控制目标文件大小 + rewrite_data_files 定期 compaction。'],
        ['无 Time Travel', '覆盖写后无法回滚、无法对比历史、无法审计。', 'Iceberg：不可变 Snapshot + VERSION AS OF / TIMESTAMP AS OF + rollback。'],
      ]
      const pl = el.querySelector('#painList'), pd = el.querySelector('#painD')
      pains.forEach(([n, p, s]) => {
        const div = document.createElement('div')
        div.className = 'pain-item'
        div.innerHTML = '<strong>' + n + '</strong><span>' + p + '</span>'
        div.onclick = () => {
          pl.querySelectorAll('.pain-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on')
          pd.innerHTML = '<b>痛点：' + n + '</b><br>' + p + '<br><br><span class="pill ok">Iceberg 解法</span> ' + s
        }
        pl.appendChild(div)
      })

      const cmps = [
        ['Apache Iceberg', '元数据树 + Manifest，无中心日志。隐藏分区、分区演进、多引擎最广。通用湖仓首选。'],
        ['Apache Hudi', 'Timeline + 索引，MOR Upsert 最成熟、增量拉取最强。CDC 入湖首选。'],
        ['Delta Lake', 'Delta Log + Spark 深度集成。Databricks 生态最佳，其他引擎支持较弱。'],
      ]
      const cc = el.querySelector('#cmpChips'), cd = el.querySelector('#cmpD')
      cmps.forEach(([n, d]) => {
        const b = document.createElement('button')
        b.className = 'chip ghost'; b.type = 'button'; b.textContent = n
        b.onclick = () => {
          cc.querySelectorAll('.chip').forEach(x => x.classList.add('ghost'))
          b.classList.remove('ghost'); cd.innerHTML = '<b>' + n + '</b>：' + d
        }
        cc.appendChild(b)
      })
    }

    /* ============ 02 架构与元数据层级 ============ */
    function render02(el) {
      el.innerHTML = `
        <h2>五层元数据：从表名到数据文件</h2>
        <p class="lead">Catalog 只存一个指针。查询时逐层下钻、逐层裁剪，最终只 open 需要的文件。点每一层看职责。</p>

        <div class="meta-stack" id="metaStack"></div>
        <div class="detail" id="metaD" style="min-height:4em">点击上方任意一层。</div>

        <h4>快照版本树（点击查看）</h4>
        <div class="snap-tree" id="snapTree"></div>
        <div class="detail" id="snapD" style="min-height:3em">点击上方快照。</div>

        <h4>一次提交的原子切换</h4>
        <div class="pointer-box" id="ptrBox">

      let nextId = 4
      let amountWide = false
      const rows = el.querySelector('#schemaRows')
      const fileCols = el.querySelector('#fileCols')
      const log = el.querySelector('#schemaLog')

      function draw(changedId) {
        rows.innerHTML = ''
        cols.forEach(c => {
          const d = document.createElement('div')
          d.className = 'schema-row' + (c.id === changedId ? ' changed' : '')
          d.innerHTML = '<span>id=' + c.id + '</span><span>' + c.name + '</span><span>' + c.type + '</span>'
          rows.appendChild(d)
        })
        const base = [{ id: 1, n: 'order_id' }, { id: 2, n: 'user_id' }, { id: 3, n: 'amount' }]
        fileCols.textContent = base.map(b => {
          const cur = cols.find(c => c.id === b.id)
          return 'Data File 列 ' + b.id + '（原始 ' + b.n + '）  →  Schema 映射为 ' + (cur ? cur.name + ':' + cur.type : '（已删除，忽略）')
        }).join('\n')
      }
      el.querySelector('#addCol').onclick = () => {
        if (cols.some(c => c.name === 'channel')) { log.innerHTML += '\n<span class="hot">channel 已存在</span>'; return }
        cols.push({ id: nextId, name: 'channel', type: 'string' })
        log.innerHTML += '\n<span class="ok">ADD COLUMN channel</span>：分配新列 ID=' + nextId + '，旧文件该列读为 null，不重写。'
        nextId++; draw(nextId - 1)
      }
      el.querySelector('#dropCol').onclick = () => {
        const i = cols.findIndex(c => c.name === 'channel')
        if (i < 0) { log.innerHTML += '\n<span class="hot">没有 channel 列可删</span>'; return }
        const id = cols[i].id
        cols.splice(i, 1)
        log.innerHTML += '\n<span class="ok">DROP COLUMN channel</span>：只删元数据，列 ID=' + id + ' 永不复用；数据文件里的列仍在。'
        draw()
      }
      el.querySelector('#renameCol').onclick = () => {
        const c = cols.find(c => c.id === 3)
        if (!c) return
        c.name = c.name === 'amount' ? 'total_amount' : 'amount'
        log.innerHTML += '\n<span class="ok">RENAME COLUMN</span>：列 ID=3 不变，只改名字 → 历史数据自动映射。'
        draw(3)
      }
      el.querySelector('#typeCol').onclick = () => {
        const c = cols.find(c => c.id === 3)
        if (!c) return
        amountWide = !amountWide
        c.type = amountWide ? 'decimal(18,2)' : 'decimal(12,2)'
        log.innerHTML += '\n<span class="ok">ALTER COLUMN TYPE</span>：' + c.type + '（安全提升，旧文件读取时自动转换）。'
        draw(3)
      }
      el.querySelector('#resetCol').onclick = () => {
        cols = [
          { id: 1, name: 'order_id', type: 'long' },
          { id: 2, name: 'user_id', type: 'long' },
          { id: 3, name: 'amount', type: 'decimal(12,2)' },
        ]
        nextId = 4; amountWide = false
        log.textContent = '初始 Schema：order_id(1) / user_id(2) / amount(3)。'
        draw()
      }
      draw()
    }

    /* ============ 08 与 Spark/Flink/Hive 集成 ============ */
    function render08(el) {
      el.innerHTML = `
        <h2>多引擎共读一张表</h2>
        <p class="lead">所有引擎共享同一个 Catalog 和 warehouse。点引擎看配置；再看 Flink 的两阶段提交如何做到 exactly-once。</p>

        <div class="eco-grid" id="ecoGrid"></div>
        <div class="detail" id="ecoD" style="min-height:4em">点击上方引擎。</div>

        <h4>Flink 流式写入 exactly-once</h4>
        <div class="toolbar">
          <button class="primary" id="flinkNext">下一步</button>
          <button id="flinkReset">重置</button>
          <span class="pill" id="flinkTag">未开始</span>
        </div>
        <div class="log" id="flinkLog">点击「下一步」看 checkpoint 两阶段提交。</div>

        <h4>版本兼容矩阵</h4>
        <table class="tbl">
          <tr><th>Iceberg</th><th>Spark</th><th>Flink</th><th>Hive</th></tr>
          <tr><td>1.4.x</td><td>3.3 / 3.4</td><td>1.16 / 1.17</td><td>4.0（只读）</td></tr>
          <tr><td>1.5.x</td><td>3.4 / 3.5</td><td>1.17 / 1.18</td><td>4.0（只读）</td></tr>
          <tr><td>1.6.x</td><td>3.5</td><td>1.18 / 1.19</td><td>4.0（只读）</td></tr>
        </table>
        <p class="hint">runtime jar 的主版本后缀必须与引擎主版本严格匹配；Scala 版本（2.12 / 2.13）也要对齐。</p>
      `
      const engines = [
        ['Spark', '批 ETL 和表维护主力。需要 iceberg-spark-runtime jar + IcebergSparkSessionExtensions。', 'spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions\nspark.sql.catalog.ice=org.apache.iceberg.spark.SparkCatalog\nspark.sql.catalog.ice.type=hive'],
        ['Flink', '实时写入入口。checkpoint 两阶段提交保证 exactly-once。', "CREATE CATALOG ice WITH (\n  'type'='iceberg',\n  'catalog-type'='hive',\n  'uri'='thrift://hms:9083'\n);"],
        ['Hive 4', '只读兼容存量 SQL。需要 iceberg-hive-runtime 与开关。', 'iceberg.engine.hive.enabled=true\n# cp iceberg-hive-runtime-*.jar $HIVE_HOME/auxlib/'],
        ['Trino', '交互式查询，内置 Iceberg connector，无需额外 jar。', 'connector.name=iceberg\niceberg.catalog.type=hive_metastore\nhive.metastore.uri=thrift://hms:9083'],
      ]
      const grid = el.querySelector('#ecoGrid'), d = el.querySelector('#ecoD')
      engines.forEach(([n, desc, code]) => {
        const div = document.createElement('div')
        div.className = 'eco-node'; div.textContent = n
        div.onclick = () => {
          grid.querySelectorAll('.eco-node').forEach(x => x.classList.remove('on'))
          div.classList.add('on')
          d.innerHTML = '<b>' + n + '</b>：' + desc + '<div class="code" style="margin-top:8px;font-size:0.72rem">' + code + '</div>'
        }
        grid.appendChild(div)
      })

      const steps = [
        ['checkpoint 开始', '算子状态快照：记录当前写出的文件、已提交快照。'],
        ['写 pending 文件', '本次 checkpoint 内写出的 Data File 进入 pending 状态，对读者不可见。'],
        ['checkpoint 完成', 'JobManager 确认成功，回调 notifyCheckpointComplete。'],
        ['真正 commit', 'Iceberg 写 manifest/metadata 并切换指针 → 数据可见；失败重启时未提交文件被清理。'],
      ]
      let i = -1
      const log = el.querySelector('#flinkLog'), tag = el.querySelector('#flinkTag')
      el.querySelector('#flinkNext').onclick = () => {
        i = Math.min(i + 1, steps.length - 1)
        tag.textContent = steps[i][0]
        log.innerHTML += '\n<span class="hot">[' + (i + 1) + '] ' + steps[i][0] + '</span>\n' + steps[i][1]
      }
      el.querySelector('#flinkReset').onclick = () => {
        i = -1; tag.textContent = '未开始'
        log.textContent = '点击「下一步」看 checkpoint 两阶段提交。'
      }
    }

    /* ============ 09 性能优化与实践 ============ */
    function render09(el) {
      el.innerHTML = `
        <h2>小文件治理与分区计算器</h2>
        <p class="lead">先在左边模拟 compaction 合并小文件，再用计算器根据数据量选择分区策略。</p>

        <h4>小文件模拟</h4>
        <div class="toolbar">
          <button class="primary" id="compactBtn">执行 compaction</button>
          <button id="fileReset">重置</button>
          <span class="pill" id="fileStat">32 个 4MB 文件</span>
        </div>
        <div class="small-files" id="smallFiles"></div>
        <div class="verdict" id="fileVerdict">32 个文件 → 每次查询至少 32 次 open + footer 解析。</div>

        <h4>分区策略计算器</h4>
        <div class="slider-row"><span class="name">单日数据量</span><input type="range" id="gbSlider" min="1" max="1000" value="100" /><span class="val" id="gbVal">100 GB</span></div>
        <div class="toolbar">
          <label>保留天数
            <select id="daysSel"><option value="30">30</option><option value="90">90</option><option value="365">365</option><option value="1095" selected>1095</option></select>
          </label>
          <label>查询模式
            <select id="patSel"><option value="time">按时间</option><option value="biz">按业务维度</option><option value="both">时间 + 业务</option></select>
          </label>
        </div>
        <div class="verdict" id="calcOut"></div>
      `
      let compacted = false
      const grid = el.querySelector('#smallFiles')
      const stat = el.querySelector('#fileStat')
      const verdict = el.querySelector('#fileVerdict')

      function drawFiles() {
        grid.innerHTML = ''
        if (compacted) {
          for (let i = 0; i < 4; i++) {
            const d = document.createElement('div')
            d.className = 'sf big'; d.textContent = '128M'
            d.style.gridColumn = 'span 4'; d.style.height = '48px'
            grid.appendChild(d)
          }
        } else {
          for (let i = 0; i < 32; i++) {
            const d = document.createElement('div')
            d.className = 'sf'; d.textContent = '4M'
            grid.appendChild(d)
          }
        }
      }
      el.querySelector('#compactBtn').onclick = () => {
        if (compacted) { verdict.className = 'verdict warn'; verdict.textContent = '已经合并过了。'; return }
        compacted = true
        grid.querySelectorAll('.sf').forEach(x => x.classList.add('fade'))
        setTimeout(() => {
          drawFiles()
          stat.textContent = '4 个 128MB 文件'
          verdict.className = 'verdict ok'
          verdict.innerHTML = '<b>compaction 完成：</b>32 个 4MB → 4 个 128MB。<br>读取 open 次数 32→4，Manifest entry 32→4，查询扫描开销显著下降。'
        }, 320)
      }
      el.querySelector('#fileReset').onclick = () => {
        compacted = false; drawFiles()
        stat.textContent = '32 个 4MB 文件'
        verdict.className = 'verdict'
        verdict.textContent = '32 个文件 → 每次查询至少 32 次 open + footer 解析。'
      }
      drawFiles()

      const gb = el.querySelector('#gbSlider'), gbVal = el.querySelector('#gbVal')
      const daysSel = el.querySelector('#daysSel'), patSel = el.querySelector('#patSel')
      const out = el.querySelector('#calcOut')

      function calc() {
        const daily = Number(gb.value)
        const days = Number(daysSel.value)
        const pat = patSel.value
        gbVal.textContent = daily + ' GB'
        const total = daily * days
        let strategy = '不分区'
        let parts = 1
        if (total >= 10) {
          if (daily < 10) { strategy = 'days(ts)'; parts = days }
          else if (daily < 100) { strategy = 'hours(ts)'; parts = days * 24 }
          else { strategy = 'hours(ts) + bucket(32, 高基数列)'; parts = days * 24 * 32 }
          if (pat === 'biz') strategy += ' + truncate/bucket(业务列)'
        }
        const tooMany = parts > 100000
        out.className = 'verdict ' + (tooMany ? 'bad' : total < 10 ? 'warn' : 'ok')
        out.innerHTML = '<b>建议：' + strategy + '</b><br>' +
          '总量 ≈ ' + total + ' GB；预计分区数 ≈ ' + parts.toLocaleString() + '；单分区约 ' +
          (parts > 0 ? Math.max(1, Math.round(total / parts)) : total) + ' GB。' +
          (tooMany ? '<br><span class="pill bad">分区数过多</span> 建议改用更粗粒度或减少 bucket 数。' : '<br><span class="pill ok">健康</span> 单分区 1~10GB、总数 < 10 万较为理想。')
      }
      gb.oninput = calc; daysSel.onchange = calc; patSel.onchange = calc
      calc()
    }

    /* ============ 10 生态对比与 FAQ ============ */
    function render10(el) {
      el.innerHTML = `
        <h2>四种表格式对比与面试 FAQ</h2>
        <p class="lead">先看大表定位，再展开高频面试题。选型的核心不是「谁最强」，而是「谁最匹配你的引擎和写入模式」。</p>

        <h4>Iceberg / Hudi / Delta / Paimon</h4>
        <table class="cmp">
          <tr><th>维度</th><th>Iceberg</th><th>Hudi</th><th>Delta Lake</th><th>Paimon</th></tr>
          <tr><td>元数据</td><td>元数据树 + Manifest</td><td>Timeline</td><td>_delta_log JSON</td><td>快照 + Manifest</td></tr>
          <tr><td>写入</td><td>COW + MOR</td><td>COW + MOR（最强）</td><td>COW（+DV）</td><td>COW + MOR（LSM）</td></tr>
          <tr><td>隐藏分区</td><td>✅</td><td>❌</td><td>❌</td><td>✅</td></tr>
          <tr><td>分区演进</td><td>✅ 不重写</td><td>有限</td><td>有限</td><td>✅</td></tr>
          <tr><td>增量读</td><td>✅</td><td>✅ 最强</td><td>✅ CDF</td><td>✅</td></tr>
          <tr><td>多引擎</td><td>最广</td><td>较广</td><td>Spark 最佳</td><td>Flink 最佳</td></tr>
          <tr><td>最强场景</td><td>开放多引擎湖仓</td><td>CDC Upsert</td><td>Databricks</td><td>Flink 流批一体</td></tr>
        </table>

        <h4>选型一句话</h4>
        <div class="grid3">
          <div class="card"><h3>选 Iceberg</h3><ul><li>Spark/Flink/Trino/Hive 都要读</li><li>要隐藏分区与分区演进</li><li>要 Time Travel / 分支</li></ul></div>
          <div class="card"><h3>选 Hudi</h3><ul><li>高频 CDC Upsert</li><li>增量拉取是刚需</li><li>已有 Hudi / EMR 生态</li></ul></div>
          <div class="card"><h3>选 Delta / Paimon</h3><ul><li>Delta：Databricks/Spark 深度绑定</li><li>Paimon：Flink 流批一体</li><li>按团队技术栈决定</li></ul></div>
        </div>

        <h4>常见面试题（点击展开）</h4>
        <div id="faqBox"></div>
      `
      const faqs = [
        ['Iceberg 为什么能实现 ACID？', '元数据文件不可变，提交时通过 Catalog CAS 原子切换 metadata_location 指针；读查询绑定某个 snapshot，因此满足原子性与隔离性。'],
        ['Iceberg 的元数据分几层？', 'Catalog → metadata.json → Manifest List → Manifest → Data File。逐层索引、逐层裁剪，避免打开所有文件。'],
        ['隐藏分区相比 Hive 分区有什么优势？', '分区由 days(ts) 等转换函数派生，不是真实列；查询不用写分区列；partition spec 可演进且历史数据不重写。'],
        ['Schema 演进为什么安全？', '用列 ID 而不是列名定位列；ID 分配后永不复用，改名/删列/加列都不影响历史文件读取。'],
        ['COW 和 MOR 的区别？', 'COW 重写整个文件，读快写慢；MOR 写 delete file + 新数据文件，写快读慢，需要 compaction。'],
        ['Iceberg 和 Hudi / Delta 怎么选？', '多引擎开放共享选 Iceberg；高频 CDC Upsert / 增量拉取选 Hudi；Databricks/Spark 深度绑定选 Delta；Flink 流批一体选 Paimon。'],
        ['Flink 写 Iceberg 怎么保证 exactly-once？', '基于 checkpoint 的两阶段提交：checkpoint 期间写 pending 文件，notifyCheckpointComplete 后才真正 commit；失败重启清理未提交文件。'],
        ['小文件怎么治理？', '写入控制 128MB 目标文件与 hash 分发；定期 rewrite_data_files（binpack）；配合 expire_snapshots 清理快照。'],
        ['Iceberg 查询为什么快？', '分区裁剪 → 文件 min/max 裁剪 → Parquet Row Group 裁剪，再加列裁剪。'],
        ['Hive 能读 Iceberg 吗？', 'Hive 4 支持只读（iceberg-hive-runtime + iceberg.engine.hive.enabled=true）；Hive 3 及以下不支持。'],
      ]
      const box = el.querySelector('#faqBox')
      faqs.forEach(([q, a], i) => {
        const b = document.createElement('button')
        b.className = 'faq-q'; b.innerHTML = 'Q' + (i + 1) + '. ' + q
        const ans = document.createElement('div')
        ans.className = 'faq-a hidden'; ans.textContent = a
        b.onclick = () => ans.classList.toggle('hidden')
        box.appendChild(b); box.appendChild(ans)
      })
    }

    const renders = {
      '01': render01, '02': render02, '03': render03, '04': render04,
      '05': render05, '06': render06, '07': render07, '08': render08,
      '09': render09, '10': render10,
    }

    // init
    show(current)
  </script>
</body>
