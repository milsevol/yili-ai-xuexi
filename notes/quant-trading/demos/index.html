<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>量化交易 · 交互式演示</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #fff;
    --ink: #14202b;
    --muted: #5d6b78;
    --line: rgba(20, 32, 43, 0.11);
    --brand: #0f5c56;
    --brand-soft: rgba(15, 92, 86, 0.09);
    --up: #b91c1c;
    --down: #15803d;
    --run: #1d4ed8;
    --warn: #a16207;
    --c0: #0f5c56; --c1: #1d4ed8; --c2: #b45309; --c3: #7c3aed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
      var(--bg);
    min-height: 100vh;
  }
  .app { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  @media (min-width: 880px) { .app { grid-template-columns: 220px 1fr; align-items: start; } }
  .brand h1 { margin: 0; font-size: 1.22rem; font-family: "Noto Serif SC", "Songti SC", serif; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
  .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  @media (min-width: 880px) {
    .nav { flex-direction: column; position: sticky; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  }
  .nav button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0.45rem 0.85rem; font-size: 0.85rem; cursor: pointer; text-align: left; color: var(--ink); white-space: nowrap; }
  @media (min-width: 880px) { .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; } .nav button:hover { background: #eef3f2; } }
  .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 24px; min-height: 440px; }
  .panel h2 { margin: 0 0 6px; font-size: 1.18rem; }
  .panel h4 { margin: 20px 0 8px; font-size: 0.95rem; }
  .lead { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; line-height: 1.65; }
  .grid2 { display: grid; gap: 12px; }
  @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .grid3 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fafcfc; }
  .card h3 { margin: 0 0 6px; font-size: 0.92rem; }
  .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.84rem; line-height: 1.55; }
  .pick { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; cursor: pointer; background: #fff; transition: all .2s; }
  .pick:hover, .pick.on { border-color: var(--brand); background: var(--brand-soft); }
  .pick strong { display: block; font-size: 0.9rem; margin-bottom: 3px; }
  .pick span { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }
  .detail { margin-top: 10px; padding: 11px 14px; border-radius: 10px; background: var(--brand-soft); font-size: 0.88rem; line-height: 1.65; min-height: 3em; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
  .node { border: 2px solid var(--brand); background: #fff; color: var(--brand); border-radius: 9px; padding: 0.42rem 0.7rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; text-align: center; }
  .node.on { background: var(--brand); color: #fff; }
  .node.muted { border-color: var(--line); color: var(--muted); font-weight: 500; }
  .arrow { color: var(--muted); font-size: 0.8rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 12px; }
  .toolbar label { font-size: 0.84rem; color: var(--muted); }
  .toolbar input[type=number], .toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 0.35rem 0.5rem; font-size: 0.84rem; background: #fff; color: var(--ink); }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 0.42rem 0.8rem; font-size: 0.85rem; cursor: pointer; color: var(--ink); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .btn:hover { filter: brightness(0.97); }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 0.8rem; cursor: pointer; color: var(--ink); }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .slider-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 0.84rem; }
  .slider-row .name { width: 170px; flex: none; color: var(--muted); }
  .slider-row input[type=range] { flex: 1; accent-color: var(--brand); }
  .slider-row .val { width: 84px; flex: none; text-align: right; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; font-size: 0.82rem; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 0.83rem; margin-top: 8px; }
  table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
  table.tbl th { color: var(--muted); font-weight: 600; }
  .metrics { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); margin-top: 10px; }
  .metric { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fafcfc; }
  .metric .k { font-size: 0.72rem; color: var(--muted); }
  .metric .v { font-size: 1.02rem; font-weight: 700; font-family: ui-monospace, Menlo, monospace; margin-top: 2px; }
  .v.up { color: var(--up); } .v.down { color: var(--down); }
  .hint { font-size: 0.79rem; color: var(--muted); line-height: 1.6; margin-top: 8px; }
  .verdict { margin-top: 10px; padding: 10px 13px; border-radius: 10px; font-size: 0.86rem; line-height: 1.6; }
  .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
  .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
  .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
  .chart { width: 100%; height: auto; background: #fbfdfd; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; line-height: 1.55; background: #14202b; color: #e6edf3; border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; margin-top: 8px; }
  .bars { margin-top: 8px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
  .bar-row .lbl { width: 62px; color: var(--muted); flex: none; }
  .bar-track { flex: 1; background: #eaeef1; border-radius: 6px; height: 16px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brand); border-radius: 6px; }
  .bar-fill.warn { background: var(--warn); }
  .bar-val { width: 96px; flex: none; color: var(--muted); text-align: right; }
  .faq-q { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 12px; font-size: 0.86rem; cursor: pointer; margin-top: 7px; color: var(--ink); }
  .faq-q:hover { border-color: var(--brand); }
  .faq-a { margin: 4px 0; padding: 8px 12px; border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 0 8px 8px 0; font-size: 0.84rem; line-height: 1.65; }
  .pill { display: inline-block; border-radius: 999px; padding: 0.08rem 0.5rem; font-size: 0.72rem; background: #eef2f8; color: var(--muted); }
  .pill.bad { background: #fee2e2; color: var(--up); }
  .pill.good { background: #dcfce7; color: var(--down); }
  .pill.warn { background: #fef3c7; color: var(--warn); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand" style="margin-bottom:12px">
      <h1>量化交易 交互演示</h1>
      <p>从市场规则、因子、回测到执行与风控。点左侧章节，动手改参数看结果。</p>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="panel" id="panel"></main>
</div>

<script>
const chapters = [
  { id: '01', title: '01 概述与定位' },
  { id: '02', title: '02 市场微结构与规则' },
  { id: '03', title: '03 数据与因子研究' },
  { id: '04', title: '04 策略与信号' },
  { id: '05', title: '05 回测与绩效' },
  { id: '06', title: '06 组合优化与风险' },
  { id: '07', title: '07 交易执行' },
  { id: '08', title: '08 工程架构与实盘' },
  { id: '09', title: '09 AI 与量化投研' },
  { id: '10', title: '10 工具生态与 FAQ' },
]

const params = new URLSearchParams(location.search)
let current = (params.get('c') || '01').padStart(2, '0')
const nav = document.getElementById('nav')
const panel = document.getElementById('panel')

chapters.forEach((c) => {
  const b = document.createElement('button')
  b.textContent = c.title
  b.dataset.id = c.id
  b.onclick = () => show(c.id)
  nav.appendChild(b)
})

function show(id) {
  current = id
  nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
  history.replaceState(null, '', '?c=' + id)
  panel.innerHTML = ''
  renders[id](panel)
}

/* ================= 工具函数 ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0
    let t = Math.imul(a ^ (a >>> 15), 1 | a)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function gauss(rng) {
  let u = 0, v = 0
  while (u === 0) u = rng()
  while (v === 0) v = rng()
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)
}
function fmt(n, d = 2) { return Number(n).toFixed(d) }
function pct(n, d = 2) { return (n * 100).toFixed(d) + '%' }
function bps(n, d = 1) { return Number(n).toFixed(d) + ' bps' }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)) }

function chartSvg(w, h, inner) {
  return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet">' +
    '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#fbfdfd"/>' + inner + '</svg>'
}
function polyline(pts, color, width, dash) {
  const s = pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')
  return '<polyline points="' + s + '" fill="none" stroke="' + color + '" stroke-width="' + width + '"' +
    (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linejoin="round" stroke-linecap="round"/>'
}
function circle(x, y, r, color) {
  return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + color + '"/>'
}
function text(x, y, str, opts) {
  opts = opts || {}
  return '<text x="' + x + '" y="' + y + '" font-size="' + (opts.size || 10) + '" fill="' + (opts.fill || '#5d6b78') +
    '" text-anchor="' + (opts.anchor || 'start') + '" font-family="ui-monospace, Menlo, monospace">' + str + '</text>'
}
function movingAvg(arr, n) {
  const out = []
  let sum = 0
  for (let i = 0; i < arr.length; i++) {
    sum += arr[i]
    if (i >= n) sum -= arr[i - n]
    out.push(i >= n - 1 ? sum / n : null)
  }
  return out
}
function std(arr) {
  const m = arr.reduce((a, b) => a + b, 0) / arr.length
  return Math.sqrt(arr.reduce((a, b) => a + (b - m) * (b - m), 0) / arr.length)
}
function rankCorr(a, b) {
  const n = a.length
  const ra = rankOf(a), rb = rankOf(b)
  const ma = ra.reduce((x, y) => x + y, 0) / n
  const mb = rb.reduce((x, y) => x + y, 0) / n
  let cov = 0, va = 0, vb = 0
  for (let i = 0; i < n; i++) {
    cov += (ra[i] - ma) * (rb[i] - mb)
    va += (ra[i] - ma) * (ra[i] - ma)
    vb += (rb[i] - mb) * (rb[i] - mb)
  }
  return cov / Math.sqrt(va * vb)
}
function rankOf(a) {
  const idx = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0])
  const r = new Array(a.length)
  for (let i = 0; i < idx.length; i++) r[idx[i][1]] = i + 1
  return r
}

/* ================= 01 概述 ================= */
const STRATS = [
  { name: '趋势 / 动量', src: '价格惯性、信息扩散慢、处置效应', hold: '天—月', cap: '中高', turn: '低—中', risk: '震荡市反复止损、动量崩溃', tag: '方向性' },
  { name: '均值回归', src: '短期过度反应后的修复', hold: '分钟—几天', cap: '中', turn: '高', risk: '单边趋势、流动性枯竭', tag: '方向性' },
  { name: '多因子选股', src: '价值/质量/成长等风险溢价', hold: '周—季', cap: '大', turn: '低—中', risk: '因子失效、拥挤、风格切换', tag: '横截面' },
  { name: '指数增强', src: '基准 Beta + 可控跟踪误差下的 Alpha', hold: '月—季', cap: '大', turn: '低', risk: '跟踪误差放大、行业偏离', tag: '横截面' },
  { name: '统计套利', src: '相关资产价差的均值回归', hold: '分钟—周', cap: '中', turn: '高', risk: '价差不回归、融券成本、挤兑', tag: '相对价值' },
  { name: '期现 / 跨期套利', src: '基差、展期收益、交割约束', hold: '天—月', cap: '中', turn: '中', risk: '基差走阔、保证金、流动性', tag: '相对价值' },
  { name: 'CTA / 期货', src: '趋势 + 期限结构 + 波动率', hold: '天—月', cap: '中高', turn: '中', risk: '杠杆、跳空、展期损耗', tag: '衍生品' },
  { name: '事件驱动', src: '信息冲击后的定价修正', hold: '天—周', cap: '小—中', turn: '高', risk: '事件落空、拥挤、停牌', tag: '事件' },
  { name: '做市 / 高频', src: '买卖价差 + 返佣 + 微观结构', hold: '毫秒—秒', cap: '小', turn: '极高', risk: '技术故障、逆向选择、监管', tag: '高频' },
]
function render01(el) {
  el.innerHTML = `
    <h2>量化交易在做什么</h2>
    <p class="lead">量化不是「预测更准」，而是让决策可验证、可复制、可规模化。先看策略谱系：每类策略的收益来源不同，容量与换手也完全不同，混着比收益率没有意义。</p>
    <h4>策略谱系：点卡片看收益来源与代价</h4>
    <div class="grid3" id="s01"></div>
    <div class="detail" id="d01">点击上方任意策略。</div>
    <h4>一条完整的决策链路</h4>
    <div class="flow" id="f01"></div>
    <div class="detail" id="fd01">点击链路中的环节，看它最关键的问题。</div>
    <h4>先记住三个不等式</h4>
    <div class="grid3">
      <div class="card"><h3>回测好 ≠ 实盘好</h3><ul><li>成本、滑点、容量、成交假设任何一项低估，都能把 Alpha 吃光。</li><li>回测只能证伪，不能证明。</li></ul></div>
      <div class="card"><h3>收益高 ≠ 能力强</h3><ul><li>先做收益归因：赚的是 Beta、行业、风格，还是真正的 Alpha。</li><li>杠杆放大的收益，也会同样放大尾部风险。</li></ul></div>
      <div class="card"><h3>容量大 ≠ 策略好</h3><ul><li>高频策略的夏普可以很高，但规模一大就自我磨损。</li><li>规模、换手、冲击成本是一组连带约束。</li></ul></div>
    </div>
  `
  const s = el.querySelector('#s01'), d = el.querySelector('#d01')
  STRATS.forEach((x, i) => {
    const b = document.createElement('div')
    b.className = 'pick'
    b.innerHTML = '<strong>' + x.name + '</strong><span>' + x.tag + ' · ' + x.hold + '</span>'
    b.onclick = () => {
      s.querySelectorAll('.pick').forEach((n) => n.classList.remove('on'))
      b.classList.add('on')
      d.innerHTML = '<b>' + x.name + '</b>（' + x.tag + '）<br>' +
        '收益来源：' + x.src + '<br>' +
        '持仓周期：' + x.hold + ' ｜ 容量：' + x.cap + ' ｜ 换手：' + x.turn + '<br>' +
        '主要风险：' + x.risk
    }
    s.appendChild(b)
  })
  const CHAIN = [
    ['数据', '有没有未来函数、幸存者偏差、复权错误？'],
    ['因子', '有没有经济学逻辑，还是纯数据挖掘？'],
    ['信号', '阈值是否稳定，换一段样本还成立吗？'],
    ['组合', '行业、市值、风格暴露是否失控？'],
    ['执行', '成本、滑点、成交量约束是否被低估？'],
    ['风控', '极端行情下能不能活下来？'],
    ['归因', '赚的到底是 Alpha 还是 Beta？'],
  ]
  const f = el.querySelector('#f01'), fd = el.querySelector('#fd01')
  CHAIN.forEach((x, i) => {
    if (i > 0) {
      const a = document.createElement('span'); a.className = 'arrow'; a.textContent = '→'; f.appendChild(a)
    }
    const n = document.createElement('span')
    n.className = 'node'; n.textContent = x[0]
    n.onclick = () => {
      f.querySelectorAll('.node').forEach((m) => m.classList.remove('on'))
      n.classList.add('on')
      fd.innerHTML = '<b>' + x[0] + '</b>：' + x[1]
    }
    f.appendChild(n)
  })
}

/* ================= 02 市场微结构 ================= */
function render02(el) {
  el.innerHTML = `
    <h2>订单簿与交易成本</h2>
    <p class="lead">回测里最容易被忽略的一步，是「这笔单到底能不能按这个价格成交」。下面是一个五档订单簿，改下单量，看市价买单如何逐档吃穿、滑点如何产生。</p>
    <div class="grid2">
      <div>
        <h4>卖盘（Ask）</h4>
        <table class="tbl" id="askTbl"></table>
      </div>
      <div>
        <h4>买盘（Bid）</h4>
        <table class="tbl" id="bidTbl"></table>
      </div>
    </div>
    <div class="toolbar">
      <label>市价买入数量</label>
      <input type="number" id="qty02" value="5000" step="1000" min="100" style="width:120px" />
      <button class="btn primary" id="run02">模拟吃单</button>
      <span class="pill" id="mid02"></span>
    </div>
    <div class="detail" id="out02">等待模拟。</div>
    <h4>A 股规则速查</h4>
    <table class="tbl">
      <tr><th>规则</th><th>要点</th><th>对策略的影响</th></tr>
      <tr><td>T+1</td><td>当日买入的股票，次一交易日才能卖出</td><td>日内无法止损；隔夜跳空风险无法规避</td></tr>
      <tr><td>涨跌停</td><td>主板 ±10%，ST ±5%，科创/创业 ±20%，北交所 ±30%</td><td>涨停买不进、跌停卖不出，回测必须模拟无法成交</td></tr>
      <tr><td>最小单位</td><td>买入 100 股整数倍；卖出可一次性卖零股</td><td>小资金难以精确按权重建仓</td></tr>
      <tr><td>费用</td><td>佣金（约万 2.5，最低 5 元）、卖出印花税 0.05%、过户费</td><td>高频策略被固定费用与印花税严重侵蚀</td></tr>

/* ================= 04 策略与信号 ================= */
function genPrice(seed, n) {
  const rng = mulberry32(seed)
  let p = 100
  const arr = []
  for (let i = 0; i < n; i++) {
    const drift = i < n / 2 ? 0.0007 : 0.0000
    const cycle = i < n / 2 ? 0 : 0.0016 * Math.sin(i / 7)
    p *= Math.exp(drift + cycle + 0.013 * gauss(rng))
    arr.push(p)
  }
  return arr
}
function backtestSignal(price, signal, costBps) {
  let equity = 1, pos = 0, trades = 0
  const eq = [1]
  for (let i = 1; i < price.length; i++) {
    const ret = price[i] / price[i - 1] - 1
    let pnl = pos * ret
    if (signal[i - 1] !== pos) {
      pnl -= costBps / 10000 * Math.abs(signal[i - 1] - pos)
      pos = signal[i - 1]
      trades++
    }
    equity *= 1 + pnl
    eq.push(equity)
  }
  return { eq, trades }
}
function maxDrawdown(eq) {
  let peak = eq[0], mdd = 0
  eq.forEach((v) => { peak = Math.max(peak, v); mdd = Math.min(mdd, v / peak - 1) })
  return mdd
}

    const drag = (zero.eq[n - 1] - eq[n - 1]) * 100
    el.querySelector('#out05').innerHTML = '单位：单边 ' + cost + ' bps，共 ' + bt.trades + ' 次换手。' +
      '零成本累计收益 ' + pct(zero.eq[n - 1] - 1, 1) + '，含成本 ' + pct(eq[n - 1] - 1, 1) +
      '，成本拖累约 <b>' + drag.toFixed(1) + ' 个百分点</b>。' +
      (cost > 30 ? '<br><span style="color:#b91c1c">当单边成本超过 30 bps，高换手策略通常很难存活。</span>' : '')
  }
  fEl.oninput = run; sEl.oninput = run; cEl.oninput = run
  run()
}

/* ================= 06 组合优化 ================= */
function render06(el) {
  el.innerHTML = `
    <h2>有效前沿：收益与风险的取舍</h2>
    <p class="lead">两资产组合的权重从 0% 到 100% 变化，会在「波动率—预期收益」平面上画出一条曲线。调参数看最小方差组合与最大夏普组合怎么移动。</p>
    <div class="slider-row"><span class="name">资产 A 预期收益</span><input type="range" id="m1" min="2" max="20" step="0.5" value="10"><span class="val" id="m1v">10.0%</span></div>
    <div class="slider-row"><span class="name">资产 B 预期收益</span><input type="range" id="m2" min="0" max="16" step="0.5" value="5"><span class="val" id="m2v">5.0%</span></div>
    <div class="slider-row"><span class="name">资产 A 波动率</span><input type="range" id="s1" min="5" max="45" step="1" value="22"><span class="val" id="s1v">22%</span></div>
    <div class="slider-row"><span class="name">资产 B 波动率</span><input type="range" id="s2" min="3" max="35" step="1" value="12"><span class="val" id="s2v">12%</span></div>
    <div class="slider-row"><span class="name">相关系数 ρ</span><input type="range" id="rho" min="-1" max="1" step="0.05" value="0.2"><span class="val" id="rhov">0.20</span></div>
    <div id="chart06"></div>
    <div class="metrics" id="m06"></div>
    <div class="detail" id="out06"></div>
    <p class="hint">有效前沿对输入极度敏感：预期收益估错 2 个百分点，最优权重可能大幅跳变。实盘里通常用收缩协方差、风险平价、行业/风格约束来「驯服」优化器，而不是直接相信均值方差的最优解。</p>
  `
  const ids = ['m1', 'm2', 's1', 's2', 'rho']
  function run() {
    const m1 = Number(el.querySelector('#m1').value) / 100
    const m2 = Number(el.querySelector('#m2').value) / 100
    const s1 = Number(el.querySelector('#s1').value) / 100
    const s2 = Number(el.querySelector('#s2').value) / 100
    const rho = Number(el.querySelector('#rho').value)
    el.querySelector('#m1v').textContent = (m1 * 100).toFixed(1) + '%'
    el.querySelector('#m2v').textContent = (m2 * 100).toFixed(1) + '%'
    el.querySelector('#s1v').textContent = (s1 * 100).toFixed(0) + '%'
    el.querySelector('#s2v').textContent = (s2 * 100).toFixed(0) + '%'
    el.querySelector('#rhov').textContent = rho.toFixed(2)
    const pts = []
    for (let i = 0; i <= 100; i++) {
      const w = i / 100
      const mu = w * m1 + (1 - w) * m2
      const v = Math.sqrt(w * w * s1 * s1 + (1 - w) * (1 - w) * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2)
      pts.push({ w, mu, v, sharpe: v > 0 ? mu / v : 0 })
    }
    const minVar = pts.reduce((a, b) => (b.v < a.v ? b : a))
    const maxSharpe = pts.reduce((a, b) => (b.sharpe > a.sharpe ? b : a))
    const W = 640, H = 300, pad = 46
    const xs = pts.map((p) => p.v), ys = pts.map((p) => p.mu)
    const xmin = Math.min.apply(null, xs) * 0.9, xmax = Math.max.apply(null, xs) * 1.05
    const ymin = Math.min.apply(null, ys) - 0.02, ymax = Math.max.apply(null, ys) + 0.02
    const xAt = (v) => pad + ((v - xmin) / (xmax - xmin)) * (W - 2 * pad)

    let inner = ''

    })
    inner += polyline(pts.map((p) => [xAt(p.v), yAt(p.mu)]), '#0f5c56', 2)
    inner += circle(xAt(minVar.v), yAt(minVar.mu), 4.5, '#1d4ed8')
    inner += text(xAt(minVar.v) + 7, yAt(minVar.mu) - 5, '最小方差', { size: 9, fill: '#1d4ed8' })
    inner += circle(xAt(maxSharpe.v), yAt(maxSharpe.mu), 4.5, '#b91c1c')
    inner += text(xAt(maxSharpe.v) + 7, yAt(maxSharpe.mu) - 5, '最大夏普', { size: 9, fill: '#b91c1c' })
    inner += text(pad, H - 12, '波动率 →')
    inner += text(10, pad + 4, '预期收益', { size: 9 })
    el.querySelector('#chart06').innerHTML = chartSvg(W, H, inner)
    el.querySelector('#m06').innerHTML = [
      ['最小方差波动', pct(minVar.v, 1), ''],
      ['最小方差收益', pct(minVar.mu, 1), ''],
      ['A 权重（MV）', pct(minVar.w, 1), ''],
      ['最大夏普', fmt(maxSharpe.sharpe, 2), 'up'],
      ['A 权重（MS）', pct(maxSharpe.w, 1), ''],
      ['组合分散收益', pct(Math.max(s1, s2) - minVar.v, 1), 'up'],
    ].map((m) => '<div class="metric"><div class="k">' + m[0] + '</div><div class="v ' + m[2] + '">' + m[1] + '</div></div>').join('')
    el.querySelector('#out06').innerHTML = '相关系数 ρ = ' + rho.toFixed(2) + '：' +
      (rho < 0.3 ? '分散效果明显，组合波动显著低于单一资产。' :
        rho < 0.8 ? '分散效果一般，但仍有降低波动的空间。' :
          '两只资产高度同向，组合几乎无法分散风险。') +
      ' 当 ρ = 1 时，前沿退化为一条直线，组合只剩「加权平均」。'
  }
  ids.forEach((id) => { el.querySelector('#' + id).oninput = run })
  run()
}

/* ================= 07 交易执行 ================= */
function render07(el) {
  el.innerHTML = `
    <h2>拆单算法：TWAP / VWAP / POV</h2>
    <p class="lead">大单一次性打出去会吃穿盘口。拆单的思路是牺牲时间换取更低的冲击，但拆得越久，价格偏离的风险越大。改订单规模与算法，看每段的下单量与预估冲击。</p>
    <div class="toolbar">
      <label>订单量（万股）</label><input type="number" id="q07" value="50" min="1" max="500" style="width:90px">
      <label>算法</label>
      <select id="a07"><option value="twap">TWAP 等分</option><option value="vwap">VWAP 按量分布</option><option value="pov">POV 20% 参与率</option></select>
      <button class="btn primary" id="run07">生成计划</button>
    </div>
    <div id="chart07"></div>
    <div class="metrics" id="m07"></div>
    <div class="detail" id="out07"></div>
    <h4>三种算法的适用场景</h4>
    <table class="tbl">
      <tr><th>算法</th><th>逻辑</th><th>适合</th><th>风险</th></tr>
      <tr><td>TWAP</td><td>把大单平均切到 N 个时间片</td><td>流动性平稳、无明显日内节奏的标的</td><td>低流动性时段参与率过高，冲击大</td></tr>
      <tr><td>VWAP</td><td>按历史成交量分布切分，跟随市场节奏</td><td>成交呈 U 型分布的主流标的</td><td>历史分布失真时反而落后基准</td></tr>
      <tr><td>POV</td><td>按实时成交量的固定比例参与</td><td>流动性差的票、希望隐藏意图</td><td>成交量萎缩时可能完不成，拖到尾盘</td></tr>
      <tr><td>IS / 到达价</td><td>在冲击与时间风险之间求最优</td><td>对价格敏感、风险厌恶高的大单</td><td>参数估计复杂，依赖波动率模型</td></tr>
    </table>
  `
  const N = 8
  const vol = [0.18, 0.12, 0.08, 0.07, 0.07, 0.09, 0.14, 0.25]
  function run() {
    const Q = (Number(el.querySelector('#q07').value) || 50) * 10000
    const algo = el.querySelector('#a07').value
    const rng = mulberry32(9527)
    const vols = vol.map((v) => v * 5000000 * (0.85 + 0.3 * rng()))
    let plan = []
    if (algo === 'twap') plan = new Array(N).fill(Q / N)
    else if (algo === 'vwap') plan = vol.map((v) => Q * v)
    else {
      let left = Q
      for (let i = 0; i < N; i++) {
        const cap = vols[i] * 0.2
        const take = Math.min(left, cap)
        plan.push(take); left -= take
      }
      if (left > 0) plan[N - 1] += left
    }
    const parts = plan.map((q, i) => q / vols[i])
    const impact = plan.map((q, i) => 200 * Math.sqrt(Math.max(q, 0) / vols[i]))
    const avgImpact = impact.reduce((a, b, i) => a + b * plan[i], 0) / Math.max(Q, 1)
    const spread = 4
    const total = spread + avgImpact
    const W = 640, H = 260, pad = 44
    const maxQ = Math.max.apply(null, plan.concat(vols)) * 1.1
    const bw = (W - 2 * pad) / N * 0.55
    let inner = ''
    for (let i = 0; i < N; i++) {
      const x = pad + (i + 0.5) * (W - 2 * pad) / N
      const hV = (vols[i] / maxQ) * (H - 2 * pad)
      const hQ = (plan[i] / maxQ) * (H - 2 * pad)
      inner += '<rect x="' + (x - bw) + '" y="' + (H - pad - hV) + '" width="' + (bw * 0.9) + '" height="' + hV + '" fill="rgba(29,78,216,0.18)" rx="2"/>'
      inner += '<rect x="' + (x - bw * 0.05) + '" y="' + (H - pad - hQ) + '" width="' + (bw * 0.9) + '" height="' + hQ + '" fill="#0f5c56" rx="2"/>'
      inner += text(x - 12, H - pad + 14, (i + 1) + '段', { size: 9 })
      if (plan[i] / vols[i] > 0.2) inner += text(x - 8, H - pad - hQ - 4, pct(plan[i] / vols[i], 0), { size: 8, fill: '#b91c1c' })
    }
    inner += text(pad, pad - 8, '蓝：该时段市场成交量　绿：我们的下单量（红字为参与率）', { size: 9 })
    el.querySelector('#chart07').innerHTML = chartSvg(W, H, inner)
    const maxPart = Math.max.apply(null, parts)
    el.querySelector('#m07').innerHTML = [
      ['预估总成本', bps(total), total > 25 ? 'down' : ''],
      ['其中冲击', bps(avgImpact), ''],
      ['买卖价差', bps(spread), ''],
      ['最大参与率', pct(maxPart, 1), maxPart > 0.25 ? 'down' : ''],
      ['完成率', '100%', ''],
      ['执行时段', N + ' 段', ''],
    ].map((m) => '<div class="metric"><div class="k">' + m[0] + '</div><div class="v ' + m[2] + '">' + m[1] + '</div></div>').join('')
    el.querySelector('#out07').innerHTML = algo === 'twap'
      ? 'TWAP 看似公平，但在成交量低谷（第 3–5 段）参与率会被动抬高，冲击成本反而更大。'
      : algo === 'vwap'
        ? 'VWAP 把量集中在开盘与尾盘，参与率更平滑，但尾盘流动性变差时仍要小心。'
        : 'POV 把每段参与率控制在 20% 左右，冲击更均匀；如果全天成交量不足，剩余量会堆积到最后一段，形成「尾盘冲刺」。'
  }
  el.querySelector('#run07').onclick = run
  el.querySelector('#a07').onchange = run
  run()
}

      <div class="card"><h3>不适合做的事</h3><ul><li>用 LLM 直接预测涨跌</li><li>随机 K-Fold 交叉验证（泄漏未来）</li><li>不看成本、不看容量地追求高 IC</li></ul></div>
    </div>
    <p class="hint">时序验证要用 Purged K-Fold + Embargo：训练集与验证集之间留出隔离期，避免标签窗口重叠。真实项目还要记录试验次数，用 Deflated Sharpe Ratio 做校正。</p>
  `
  const nEl = el.querySelector('#n09')
  function run() {
    const N = Number(nEl.value)
    el.querySelector('#n09v').textContent = N
    const rng = mulberry32(20261105)
    const T = 500
    const sharpes = []
    for (let k = 0; k < N; k++) {
      let sum = 0, sum2 = 0
      for (let i = 0; i < T; i++) {
        const r = 0.0002 + 0.011 * gauss(rng)
        sum += r; sum2 += r * r
      }
      const mean = sum / T
      const sd = Math.sqrt(Math.max(sum2 / T - mean * mean, 1e-12))
      sharpes.push(mean / sd * Math.sqrt(252))
    }
    sharpes.sort((a, b) => a - b)
    const best = sharpes[sharpes.length - 1]
    const median = sharpes[Math.floor(sharpes.length / 2)]
    const W = 640, H = 260, pad = 40
    const mn = Math.min.apply(null, sharpes) - 0.2
    const mx = Math.max.apply(null, sharpes) + 0.2
    const bins = 24, counts = new Array(bins).fill(0)
    sharpes.forEach((v) => {
      const idx = clamp(Math.floor((v - mn) / (mx - mn) * bins), 0, bins - 1)
      counts[idx]++
    })
    const maxC = Math.max.apply(null, counts)
    const bw = (W - 2 * pad) / bins
    let inner = ''
    counts.forEach((c, i) => {
      const h = (c / maxC) * (H - 2 * pad)
      inner += '<rect x="' + (pad + i * bw) + '" y="' + (H - pad - h) + '" width="' + (bw * 0.86) + '" height="' + h + '" fill="rgba(15,92,86,0.55)" rx="2"/>'
    })
    inner += '<line x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '" stroke="rgba(20,32,43,0.2)"/>'
    inner += text(pad, H - 12, '策略夏普分布（真实 Alpha = 0）')
    inner += text(6, pad + 4, '频数', { size: 9 })
    el.querySelector('#chart09').innerHTML = chartSvg(W, H, inner)
    const expectMax = 0.8 * Math.sqrt(2 * Math.log(Math.max(N, 2)))
    el.querySelector('#m09').innerHTML = [
      ['试验次数', String(N), ''],
      ['最好夏普', fmt(best, 2), best > 1.5 ? 'down' : ''],
      ['中位数夏普', fmt(median, 2), ''],
      ['理论期望最大值', '≈' + fmt(expectMax, 2), ''],
      ['虚高幅度', fmt(best - median, 2), 'down'],
      ['真实 Alpha', '0', ''],
    ].map((m) => '<div class="metric"><div class="k">' + m[0] + '</div><div class="v ' + m[2] + '">' + m[1] + '</div></div>').join('')
    el.querySelector('#p09').textContent = 'N = ' + N
    el.querySelector('#out09').innerHTML = '在真实 Alpha 为 0 的前提下，试 ' + N + ' 次，最好的夏普约 <b>' + best.toFixed(2) +
      '</b>，中位数只有 ' + median.toFixed(2) + '。这不是策略有效，而是选择偏差。' +
      '<br>实践建议：固定试验次数并登记；把样本外数据留到最后只测一次；用 Deflated Sharpe Ratio 或 Bonferroni 类方法校正阈值。'
  }
  nEl.oninput = run
  el.querySelector('#run09').onclick = run
  run()
}
