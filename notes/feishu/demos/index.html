<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>飞书应用开发 · 交互式演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #16202e;
      --muted: #5f6b7a;
      --line: rgba(22, 32, 46, 0.11);
      --brand: #3370ff;
      --brand-soft: rgba(51, 112, 255, 0.1);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
      --c0: #3370ff; --c1: #0f766e; --c2: #15803d; --c3: #7c3aed; --c4: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app { max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
    @media (min-width: 880px) { .app { grid-template-columns: 210px 1fr; align-items: start; } }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav { flex-direction: column; position: sticky; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
    }
    .nav button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 0.45rem 0.85rem; font-size: 0.86rem; cursor: pointer; text-align: left; color: var(--ink); white-space: nowrap; }
    @media (min-width: 880px) { .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; } .nav button:hover { background: #f1f5fb; } }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 22px; min-height: 440px; }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 18px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fafcff; }
    .card h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .arch { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; }
    .arch-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; transition: border-color .2s, transform .2s; background: #fff; }
    .arch-item:hover, .arch-item.on { border-color: var(--brand); transform: translateY(-1px); }
    .arch-item strong { display: block; margin-bottom: 4px; }
    .arch-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .detail { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--brand-soft); color: var(--ink); font-size: 0.9rem; line-height: 1.6; min-height: 3.2em; }
    .chip { border: none; border-radius: 999px; padding: 0.35rem 0.75rem; background: var(--brand-soft); color: var(--brand); font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .chip.ghost { background: #eef2f8; color: var(--muted); font-weight: 500; }
    .chip:hover { filter: brightness(0.97); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 0.4rem 0.75rem; font-size: 0.85rem; cursor: pointer; }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .toolbar .val { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; color: var(--brand); font-weight: 700; min-width: 3.5em; }
    .log { margin-top: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; line-height: 1.55; background: #16202e; color: #e5eaf1; border-radius: 10px; padding: 10px 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
    .log .hot { color: #fb923c; } .log .ok { color: #86efac; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; line-height: 1.55; background: #f4f6fa; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .bar-row .lbl { width: 90px; color: var(--muted); flex: none; }
    .bar-track { flex: 1; background: #eaeef5; border-radius: 6px; height: 17px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .5s ease; }
    .bar-fill.hot { background: var(--fail); } .bar-fill.good { background: var(--ok); }
    .bar-val { width: 80px; flex: none; color: var(--muted); text-align: right; }
    .faq-q { width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; font-size: 0.88rem; cursor: pointer; margin-top: 8px; }
    .faq-q:hover { border-color: var(--brand); }
    .faq-a { margin: 4px 0 4px; padding: 8px 12px; border-left: 3px solid var(--brand); background: var(--brand-soft); border-radius: 0 8px 8px 0; font-size: 0.85rem; line-height: 1.6; }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 160px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 140px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; text-align: right; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .kv { font-size: 0.85rem; line-height: 1.85; }
    .kv b { color: var(--brand); font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.75rem; background: #eef2f8; color: var(--muted); }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .step-dot { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.76rem; color: var(--muted); }
    .step-dot.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .matrix td, .matrix th { border: 1px solid var(--line); padding: 7px; text-align: center; font-size: 0.8rem; }
    .matrix td { background: #fff; }
    .flow-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .node-box { border: 1px solid var(--c0); background: var(--brand-soft); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 600; color: var(--brand); cursor: pointer; }
    .node-box:hover { filter: brightness(0.95); }
    .node-box.c1 { border-color: var(--c1); background: rgba(15,118,110,.1); color: var(--c1); }
    .node-box.c2 { border-color: var(--c2); background: rgba(21,128,61,.1); color: var(--c2); }
    .node-box.c3 { border-color: var(--c3); background: rgba(124,58,237,.1); color: var(--c3); }
    .connector { font-size: 1.2rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>飞书应用开发 交互演示</h1>
        <p>飞书开放平台 · 服务端 API · 消息卡片 · 多维表格 · 云文档 · 小程序。点章节动手玩。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与定位' },
      { id: '02', title: '02 开放平台与应用注册' },
      { id: '03', title: '03 身份认证与 Token' },
      { id: '04', title: '04 消息与卡片' },
      { id: '05', title: '05 多维表格 Bitable' },
      { id: '06', title: '06 文档与云空间' },
      { id: '07', title: '07 通讯录与组织架构' },
      { id: '08', title: '08 日历会议与审批' },
      { id: '09', title: '09 小程序与工作台' },
      { id: '10', title: '10 工作台详解' },
      { id: '11', title: '11 实战与 FAQ' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    function show(id) {
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', `?c=${id}`)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述与定位 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>飞书 vs 企业微信 vs 钉钉：三选一？</h2>
        <p class="lead">点击卡片看对比，再点开能力全景卡片了解飞书开放能力版图。</p>
        <h4>三者定位对比（点卡片看详情）</h4>
        <div class="arch" id="p1a"></div>
        <div class="detail" id="p1aD">点击上方产品卡片。</div>
        <h4>飞书开放能力全景（每块点一下）</h4>
        <div class="arch" id="p1b"></div>
        <div class="detail" id="p1bD">点击上方能力块。</div>
      `
      const comps = [
        ['飞书', '字节跳动一体化协作平台：IM + 文档 + 多维表格 + 日历会议 + 审批 原生打通。差异化在多维表格 Bitable、云文档协同、妙记 AI 纪要。事件订阅支持 WebSocket 长连接（无需公网 IP）。'],
        ['企业微信', '腾讯面向企业内部协同 + 对外客户连接。与个人微信互通是最大优势，客户联系（SCRM）能力强。事件订阅为 HTTP 回调（需公网）。'],
        ['钉钉', '阿里系企业 IM + OA。考勤/审批/组织架构强，开放平台偏钉钉生态，与个人微信基本不互通，外部联系能力弱于企微。'],
      ]
      const a = el.querySelector('#p1a'), aD = el.querySelector('#p1aD')
      comps.forEach(([n, d]) => {
        const div = document.createElement('div'); div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => { a.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on')); div.classList.add('on'); aD.innerHTML = `<b>${n}</b>：${d}` }
        a.appendChild(div)
      })
      const caps = [
        ['即时消息 IM', '发消息 / 收消息 / 群管理 API。BaseURL open.feishu.cn/open-apis/im/v1。支持文本、富文本、图片、交互式卡片等多种 msg_type。'],
        ['消息卡片', '飞书最强大的消息形态：JSON 搭建，可放按钮、表单、选择器。用户点击触发 card.action.trigger 回调到你后端，实现对话式交互。'],
        ['自定义机器人', '群里添加自定义机器人拿 Webhook URL，POST JSON 即推送。最简单，适合监控告警/CI 通知，但只能发不能收。'],
        ['多维表格 Bitable', '在线数据库 + 表格混血。表/字段/记录/视图全可 API 操作，可当轻量 CRM / 工单 / 台账，支持自动化触发。'],
        ['云文档 Docx', '新版文档用 Block 模型，可像操作 DOM 一样创建/读取/编辑文档块，自动生成报告、周报、知识库。'],
        ['云空间 Drive', '文件/文件夹管理、上传下载（分片支持大文件）、权限协作、评论。'],
        ['通讯录 Contact', '部门树、成员信息、用户组。配合 OAuth 扫码登录 / 免登，用飞书身份登录你的系统。'],
        ['日历会议审批', '创建日程邀请参会人、自动生成视频会议、妙记转写；审批实例提交 + 状态回调；考勤打卡数据拉取。'],
        ['小程序 & 网页应用', '飞书小程序（原生体验）或 H5 网页应用（复用 Web 栈）+ JSAPI 调原生能力，挂到工作台让成员访问。'],
        ['事件订阅', 'HTTP 回调（需公网）或 WebSocket 长连接（推荐，本地免穿透）。消息、审批、通讯录变更等事件实时推送。'],
      ]
      const b = el.querySelector('#p1b'), bD = el.querySelector('#p1bD')
      caps.forEach(([n, d]) => {
        const div = document.createElement('div'); div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => { b.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on')); div.classList.add('on'); bD.innerHTML = `<b>${n}</b>：${d}` }
        b.appendChild(div)
      })
    }

    /* ============ 02 开放平台与应用注册 ============ */
    function render02(el) {
      el.innerHTML = `
        <h2>应用凭证 + 权限 + 事件订阅</h2>
        <p class="lead">飞书应用的核心是 App ID / App Secret，配好权限和事件订阅才能调 API。点卡片看细节。</p>
        <h4>核心凭证与概念（点一下看详情）</h4>
        <div class="arch" id="p2a"></div>
        <div class="detail" id="p2aD">点击上方卡片。</div>
        <h4>事件订阅两种方式对比</h4>
        <table class="tbl matrix">
          <tr><th>维度</th><th>HTTP 回调</th><th>WebSocket 长连接</th></tr>
          <tr><td>公网 IP</td><td>必须（回调 URL 要公网可访问）</td><td>不需要（推荐）</td></tr>
          <tr><td>内网穿透</td><td>本地开发需要 cpolar/ngrok</td><td>本地直接连，无需穿透</td></tr>
          <tr><td>接入难度</td><td>要验签、配加密、保障 3s 响应</td><td>SDK 封装好，几行代码启动</td></tr>
          <tr><td>生产稳定性</td><td>成熟，需自己做高可用</td><td>长连接断开自动重连</td></tr>
          <tr><td>适合</td><td>已有公网服务的生产系统</td><td>本地开发、内网服务、快速联调</td></tr>
        </table>
        <h4>权限（scope）勾选模拟器</h4>
        <p class="hint">勾了 scope 后必须<strong>重新发布版本</strong>才生效；敏感权限需管理员单独授权。</p>
        <div class="arch" id="p2b"></div>
        <div class="detail" id="p2bD">点 scope 卡片看它能调什么 API。</div>
      `
      const items = [
        ['App ID', '应用唯一标识，形如 cli_a1b2c3d4e5f6g7h8。公开可见，前端也能放。在「凭证与基础信息」页获取。'],
        ['App Secret', '应用密钥，只能放服务端，绝不能进 Git / 前端。用于换取 access_token，泄露等于应用被接管。'],
        ['tenant_access_token', '代表「企业 + 应用」身份的 token，绝大多数服务端 API 用它。用 App ID + Secret 换取，有效期 ~2 小时。'],
        ['可见范围', '应用上线后只有可见范围内的成员能看到、能收消息、API 才能操作其数据。按部门/成员配置。'],
      ]
      const a = el.querySelector('#p2a'), aD = el.querySelector('#p2aD')
      items.forEach(([n, d]) => {
        const div = document.createElement('div'); div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 20)}…</span>`
        div.onclick = () => { a.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on')); div.classList.add('on'); aD.innerHTML = `<b>${n}</b>：${d}` }
        a.appendChild(div)
      })
      const scopes = [
        ['im:message', '发送、接收、回复消息。发消息必备，配合 receive_id 给用户/群发文本、卡片。'],
        ['bitable:app', '多维表格读写。能建表、增删改查记录/字段/视图。把多维表格当数据库用。'],
        ['docx:document', '新版文档读写。创建文档、读写 Block、生成报告。'],
        ['contact:user.base:readonly', '通讯录成员基础信息（姓名、头像、open_id）。手机号/邮箱需更高权限。'],
        ['calendar:calendar', '日历读写。创建日程、邀请参会人、查忙闲。'],
        ['approval:approval', '审批实例读写。提交审批、查状态、监听审批回调。'],
        ['auth:user.id', '获取用户 user_id。OAuth 登录后拿用户企业内唯一 ID。'],
      ]
      const b = el.querySelector('#p2b'), bD = el.querySelector('#p2bD')
      scopes.forEach(([n, d]) => {
        const div = document.createElement('div'); div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 22)}…</span>`
        div.onclick = () => { b.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on')); div.classList.add('on'); bD.innerHTML = `<b>${n}</b>：${d}` }
        b.appendChild(div)
      })
    }

    /* ============ 03 身份认证与 Token ============ */
    function render03(el) {
      el.innerHTML = `
        <h2>三种 Token + OAuth 流程</h2>
        <p class="lead">所有 API 都带 Bearer token。先看三种 token 区别，再走一遍 OAuth 授权码流程。</p>
        <h4>三种 Token 对比（点一下看详情）</h4>
        <div class="arch" id="p3a"></div>
        <div class="detail" id="p3aD">点击 token 卡片。</div>
        <h4>OAuth2 授权码流程（步进）</h4>
        <div class="toolbar">
          <button class="primary" id="p3next">下一步</button>
          <button id="p3reset">重置</button>
          <span class="pill" id="p3phase">未开始</span>
        </div>
        <div class="steps" id="p3steps"></div>
        <div class="log" id="p3log">点击「下一步」开始。</div>
        <h4>Token 刷新频率计算器</h4>
        <p class="hint">token 有效期 7200 秒（2 小时），不能每次请求都换（获取 token 接口有限频）。建议缓存 + 提前 5 分钟刷新。</p>
        <div class="slider-row"><span class="name">应用数量</span><input type="range" id="p3apps" min="1" max="30" value="3"><span class="val" id="p3appsV">3 个</span></div>
        <div class="slider-row"><span class="name">每应用每天刷 token 次数</span><input type="range" id="p3freq" min="1" max="200" value="12"><span class="val" id="p3freqV">12 次/天</span></div>
        <div class="verdict ok" id="p3ver">拖动滑块看 verdict。</div>
      `
      const tokens = [
        ['tenant_access_token', '代表「企业 + 应用」。企业自建应用 99% 场景用它调服务端 API（发消息、读写文档、通讯录）。用 App ID + Secret 换。'],
