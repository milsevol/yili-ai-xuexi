<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClickHouse · 交互式演示</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #16202e;
      --muted: #5f6b7a;
      --line: rgba(22, 32, 46, 0.11);
      --brand: #1d4ed8;
      --brand-soft: rgba(29, 78, 216, 0.1);
      --ok: #15803d;
      --fail: #b91c1c;
      --run: #0369a1;
      --warn: #a16207;
      --c0: #1d4ed8; --c1: #0f766e; --c2: #15803d; --c3: #7c3aed; --c4: #a16207;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 0% 0%, var(--brand-soft), transparent 55%),
        var(--bg);
      min-height: 100vh;
    }
    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
      display: grid;
      gap: 16px;
    }
    @media (min-width: 880px) {
      .app { grid-template-columns: 210px 1fr; align-items: start; }
    }
    .brand h1 { margin: 0; font-size: 1.25rem; font-family: "Noto Serif SC", "Songti SC", serif; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
    .nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    @media (min-width: 880px) {
      .nav {
        flex-direction: column;
        position: sticky; top: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
      }
    }
    .nav button {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      font-size: 0.86rem;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      white-space: nowrap;
    }
    @media (min-width: 880px) {
      .nav button { width: 100%; border-radius: 10px; border-color: transparent; background: transparent; }
      .nav button:hover { background: #f1f5fb; }
    }
    .nav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 22px;
      min-height: 440px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 1.2rem; }
    .panel h4 { margin: 18px 0 8px; font-size: 0.95rem; }
    .lead { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
    .grid2 { display: grid; gap: 12px; }
    @media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fafcff;
    }
    .card h3 { margin: 0 0 8px; font-size: 0.95rem; }
    .card ul { margin: 0; padding-left: 1.1rem; color: var(--muted); font-size: 0.86rem; line-height: 1.55; }
    .arch { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 8px; }
    .arch-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .2s, transform .2s;
      background: #fff;
    }
    .arch-item:hover, .arch-item.on { border-color: var(--brand); transform: translateY(-1px); }
    .arch-item strong { display: block; margin-bottom: 4px; }
    .arch-item span { font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .detail {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--brand-soft);
      color: var(--ink);
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 3.2em;
    }
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
    .chip {
      border: none;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.ghost { background: #eef2f8; color: var(--muted); font-weight: 500; }
    .chip:hover { filter: brightness(0.97); }
    .arrow { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 14px; }
    .toolbar button, .toolbar label {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .toolbar button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .toolbar input[type=range] { accent-color: var(--brand); }
    .toolbar .val { font-family: ui-monospace, Menlo, monospace; font-size: 0.85rem; color: var(--brand); font-weight: 700; min-width: 3.5em; }
    .log {
      margin-top: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #16202e;
      color: #e5eaf1;
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .log .hot { color: #fb923c; }
    .log .ok { color: #86efac; }
    .log .blue { color: #60a5fa; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    table.tbl th, table.tbl td { border-bottom: 1px solid var(--line); padding: 0.42rem 0.5rem; text-align: left; vertical-align: top; }
    table.tbl th { color: var(--muted); font-weight: 600; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      background: #f4f6fa;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre;
    }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
    .bar-row .lbl { width: 64px; color: var(--muted); flex: none; }
    .bar-track { flex: 1; background: #eaeef5; border-radius: 6px; height: 17px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--run); border-radius: 6px; transition: width .5s ease; }
    .bar-fill.hot { background: var(--fail); }
    .bar-fill.good { background: var(--ok); }
    .bar-val { width: 90px; flex: none; color: var(--muted); }
    .faq-q {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .faq-q:hover { border-color: var(--brand); }
    .faq-a {
      margin: 4px 0 4px;
      padding: 8px 12px;
      border-left: 3px solid var(--brand);
      background: var(--brand-soft);
      border-radius: 0 8px 8px 0;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 0.85rem; }
    .slider-row .name { width: 180px; color: var(--muted); flex: none; }
    .slider-row input { flex: 1; accent-color: var(--brand); }
    .slider-row .val { width: 100px; font-family: ui-monospace, Menlo, monospace; color: var(--brand); font-weight: 700; text-align: right; }
    .verdict { margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.6; }
    .verdict.ok { background: #f0fdf4; border: 1px solid rgba(21,128,61,.3); }
    .verdict.warn { background: #fffbeb; border: 1px solid rgba(161,98,7,.35); }
    .verdict.bad { background: #fef2f2; border: 1px solid rgba(185,28,28,.3); }
    .kv { font-size: 0.85rem; line-height: 1.85; }
    .kv b { color: var(--brand); font-family: ui-monospace, Menlo, monospace; }
    .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.55rem; font-size: 0.75rem; background: #eef2f8; color: var(--muted); }
    .pill.ok { background: #dcfce7; color: var(--ok); }
    .pill.bad { background: #fee2e2; color: var(--fail); }
    .pill.warn { background: #fef3c7; color: var(--warn); }
    .arch-flow {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      background: #fafcff; margin-top: 8px;
    }
    .arch-node {
      border: 1px solid var(--brand);
      background: var(--brand-soft);
      border-radius: 8px;
      padding: 0.4rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--brand);
      cursor: pointer;
      text-align: center;
      min-width: 60px;
    }
    .arch-node.on { background: var(--brand); color: #fff; }
    .arch-node.muted { background: transparent; border-color: var(--line); color: var(--muted); }
    .engine-compare { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 8px; }
    .engine-card { border: 2px solid var(--line); border-radius: 12px; padding: 14px; background: #fafcff; cursor: pointer; transition: all .2s; text-align: center; }
    .engine-card.on { border-color: var(--brand); background: var(--brand-soft); }
    .engine-card h5 { margin: 0 0 4px; font-size: 1rem; color: var(--brand); }
    .engine-card .speed { font-size: 0.75rem; color: var(--muted); }
    .dag-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #16202e; color: #e5eaf1; font-family: ui-monospace, Menlo, monospace; font-size: 0.78rem; margin-top: 10px; }
    .projection-box { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-top: 10px; }
    .proj-card { border: 2px solid var(--line); border-radius: 12px; padding: 12px; background: #fafcff; cursor: pointer; text-align: center; transition: all .2s; }
    .proj-card.on { border-color: var(--brand); background: var(--brand-soft); }
    .proj-card h5 { margin: 0 0 4px; font-size: 0.95rem; color: var(--brand); }
    .part-viz { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 10px; }
    .part-cell {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
      background: #fafcff;
      font-family: ui-monospace, Menlo, monospace;
      text-align: center;
    }
    .part-cell.scanned { background: #fee2e2; border-color: var(--fail); color: var(--fail); font-weight: 600; }
    .part-cell.skipped { background: #dcfce7; border-color: var(--ok); color: var(--ok); }
    .dist-viz { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 10px; }
    .dist-node { border: 2px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all .2s; background: #fff; }
    .dist-node.on { border-color: var(--brand); background: var(--brand-soft); }
    .dist-node.coordinator { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
    .dist-node h5 { margin: 0; font-size: 0.9rem; }
    .dist-node p { margin: 2px 0 0; font-size: 0.72rem; color: var(--muted); }
    .mv-viz { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fafcff; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
    .mv-box { border: 2px solid var(--brand); border-radius: 10px; padding: 8px 12px; background: var(--brand-soft); color: var(--brand); font-size: 0.82rem; font-weight: 600; }
    .trace-step {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.82rem;
      background: #fff;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
    }
    .trace-step.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
    .trace-step.current { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
    .schema-viz { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 10px; }
    .schema-card { border: 2px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; transition: all .2s; }
    .schema-card.on { border-color: var(--brand); background: var(--brand-soft); }
    .schema-card h5 { margin: 0 0 4px; font-size: 0.95rem; color: var(--brand); }
    .schema-card .tag { display: inline-block; border-radius: 999px; padding: 0.05rem 0.5rem; font-size: 0.7rem; margin-right: 3px; margin-top: 4px; }
    .decision-tree { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fafcff; margin-top: 10px; }
    .dt-node { padding: 6px 10px; border-radius: 8px; margin: 4px 0; font-size: 0.85rem; }
    .dt-node.q { background: #eef2f8; color: var(--ink); border-left: 3px solid var(--brand); font-weight: 600; }
    .dt-node.a { background: var(--ok-color, #dcfce7); color: var(--ok); padding-left: 24px; }
    .dt-node.b { background: #fee2e2; color: var(--fail); padding-left: 24px; }
    .col-row { display: grid; grid-template-columns: 60px 100px 100px 1fr; gap: 6px; align-items: center; font-size: 0.78rem; font-family: ui-monospace, Menlo, monospace; padding: 4px 0; }
    .col-row .col-header { color: var(--muted); font-size: 0.72rem; }
    .simd-viz { display: flex; gap: 4px; align-items: center; margin: 10px 0; }
    .simd-vec { display: flex; gap: 2px; }
    .simd-cell { width: 24px; height: 24px; background: var(--brand-soft); border: 1px solid var(--brand); border-radius: 4px; text-align: center; font-size: 0.6rem; line-height: 22px; color: var(--brand); font-weight: 700; }
    .simd-cell.scalar { background: #fef3c7; border-color: var(--warn); color: var(--warn); }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand" style="margin-bottom:12px">
        <h1>ClickHouse 交互演示</h1>
        <p>列式 OLAP 数据库 · MergeTree + 向量化。点左侧章节，动手玩概念。</p>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="panel" id="panel"></main>
  </div>

  <script>
    const chapters = [
      { id: '01', title: '01 概述与定位' },
      { id: '02', title: '02 架构与核心组件' },
      { id: '03', title: '03 MergeTree 引擎家族' },
      { id: '04', title: '04 数据类型与 SQL' },
      { id: '05', title: '05 分区排序与索引' },
      { id: '06', title: '06 向量化执行与查询原理' },
      { id: '07', title: '07 分布式与集群' },
      { id: '08', title: '08 物化视图与 CDC' },
      { id: '09', title: '09 性能调优与实践' },
      { id: '10', title: '10 生态对比与 FAQ' },
    ]

    const params = new URLSearchParams(location.search)
    let current = (params.get('c') || '01').padStart(2, '0')
    const nav = document.getElementById('nav')
    const panel = document.getElementById('panel')

    chapters.forEach((c) => {
      const b = document.createElement('button')
      b.textContent = c.title
      b.dataset.id = c.id
      b.onclick = () => show(c.id)
      nav.appendChild(b)
    })

    function show(id) {
      current = id
      nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.id === id))
      history.replaceState(null, '', `?c=${id}`)
      panel.innerHTML = ''
      renders[id](panel)
    }

    /* ============ 01 概述与定位 ============ */
    function render01(el) {
      el.innerHTML = `
        <h2>ClickHouse 在大数据链路中的位置</h2>
        <p class="lead">ClickHouse 是列式 OLAP 数据库，核心是 MergeTree + 向量化执行。点下方引擎/组件卡片看定位；再看为什么它那么快。</p>

        <h4>ClickHouse vs Hive vs Spark SQL vs Trino vs Doris</h4>
        <div class="arch" id="compCards"></div>
        <div class="detail" id="compD">点击上方卡片。</div>

        <h4>为什么 ClickHouse 那么快？四大机制</h4>
        <div class="arch-flow" style="justify-content:center;flex-wrap:wrap;padding:16px">
          <div style="text-align:center">
            <span class="arch-node on">列式存储</span><br>
            <span class="pill">IO ↓ 90%</span>
          </div>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">×</span>
          <div style="text-align:center">
            <span class="arch-node on">SIMD 向量化</span><br>
            <span class="pill">运算 ↑ 5-10x</span>
          </div>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">×</span>
          <div style="text-align:center">
            <span class="arch-node on">有序 MergeTree</span><br>
            <span class="pill">索引精准</span>
          </div>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">×</span>
          <div style="text-align:center">
            <span class="arch-node on">无锁异步 IO</span><br>
            <span class="pill">高并发</span>
          </div>
        </div>

        <h4>大数据全链路位置图</h4>
        <div class="arch-flow" style="justify-content:center">
          <span class="arch-node muted">数据采集</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node muted">Kafka/Flink CDC</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node muted">Hive/Spark ETL</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node on" id="ckNode">ClickHouse（ADS 层）</span>
          <span class="pill" style="background:#eef2f8;color:#5f6b7a">→</span>
          <span class="arch-node muted">Grafana/BI</span>
        </div>
        <p class="hint">ClickHouse 经常被用来<strong>替换 Hive 的 ADS 报表层</strong>，但前面的 ODS/DWD/DWS 清洗链路还是靠 Hive/Spark 来跑。</p>

        <h4>ClickHouse vs 主要对手对比表</h4>
        <table class="tbl">
          <tr><th>维度</th><th>ClickHouse</th><th>Hive (on Tez)</th><th>Spark SQL</th><th>Trino</th><th>Doris</th></tr>
          <tr><td>延迟</td><td><b>毫秒~秒级</b></td><td>分钟级</td><td>秒级~分钟级</td><td>亚秒级~秒级</td><td>毫秒级~秒级</td></tr>
          <tr><td>事务</td><td><span class="pill bad">无</span></td><td>4.x 部分支持</td><td>Delta/Iceberg</td><td>只读</td><td><span class="pill ok">有</span></td></tr>
          <tr><td>点查</td><td><span class="pill bad">不适合</span></td><td><span class="pill bad">不适合</span></td><td><span class="pill bad">不适合</span></td><td><span class="pill bad">不适合</span></td><td><span class="pill ok">支持</span></td></tr>
          <tr><td>复杂 JOIN</td><td><span class="pill warn">较弱</span></td><td>成熟</td><td>Catalyst 强</td><td>强</td><td><span class="pill ok">强</span></td></tr>
          <tr><td>存储</td><td>MergeTree</td><td>HDFS/对象存储</td><td>外部存储</td><td>外部存储</td><td>本地列存</td></tr>
        </table>
      `
      const comps = [
        ['ClickHouse', 'OLAP 数据库。<b>列式 + 向量化 + MergeTree</b>。同量级数据单表聚合比 Hive/Spark/Trino 快 5–100 倍。适合实时看板、用户行为分析、日志分析。'],
        ['Hive (on Tez)', '数仓 SQL 层。把 HDFS 文件映射成表，用 HiveQL 查。4.x 回归 Metastore + SQL 兼容层。分钟级延迟，数仓建模成熟。'],
        ['Spark SQL', '多模态计算引擎。Catalyst 优化器快，支持 RDD 迭代、MLlib、流处理。可以连 Hive Metastore 直接读写 Hive 表。'],
        ['Trino (Presto)', '亚秒级交互式查询引擎。纯内存列式执行，多数据源联邦查询（Hive + MySQL + Cassandra + ClickHouse）。不做长 ETL。'],
        ['Doris / StarRocks', '列式 OLAP 同赛道。原生 MySQL 协议、支持 2PC 事务、冷热分离好。适合需要复杂 JOIN、事务、全链路数仓的场景。'],
      ]
      const cc = el.querySelector('#compCards'), cd = el.querySelector('#compD')
      comps.forEach(([n, d]) => {
        const div = document.createElement('div')
        div.className = 'arch-item'
        div.innerHTML = `<strong>${n}</strong><span>${d.slice(0, 30)}…</span>`
        div.onclick = () => {
          cc.querySelectorAll('.arch-item').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); cd.innerHTML = `<b>${n}</b>：${d}`
        }

      Object.keys(trees).forEach(key => {

          Object.keys(trees).forEach(k => el.querySelector(`[data-issue="${k}"]`).classList.add('ghost'))
          el.querySelector(`[data-issue="${key}"]`).classList.remove('ghost')
          const info = trees[key]
          const out = el.querySelector('#issueOut')
          out.innerHTML = `<div class="dt-node q">问题：${info.q}</div>` +
            info.path.map(([question, answer], i) =>
              `<div class="dt-node q">Q${i+1}: ${question}</div>${answer ? `<div class="dt-node ${answer.includes('✅')?'a':'b'}">→ ${answer}</div>` : ''}`
            ).join('')
        }
      })
      setTimeout(() => el.querySelector('[data-issue="write"]').click(), 30)

      el.querySelector('#chkPart').onclick = () => {
        const status = el.querySelector('#partStatus')
        const partCount = Math.floor(Math.random() * 500) + 50
        if (partCount < 1000) {
          status.className = 'verdict ok'
          status.innerHTML = `✅ <b>Part 数量正常</b>：单表 Part ≈ ${partCount}，远低于 1000 警戒线。继续保持批量写入。`
        } else if (partCount < 10000) {
          status.className = 'verdict warn'
          status.innerHTML = `⚠️ <b>Part 数量偏高</b>：单表 Part ≈ ${partCount}，接近警戒线。建议检查写入批量，开启 AsyncInsert。`
        } else {
          status.className = 'verdict bad'
          status.innerHTML = `❌ <b>Part 数量危险</b>：单表 Part ≈ ${partCount}，超过 10000！可能即将拒绝写入。立即优化！`
        }
      }
    }

    /* ============ 10 生态对比与 FAQ ============ */
    function render10(el) {
      el.innerHTML = `
        <h2>生态对比 & 常见面试题手风琴</h2>
        <p class="lead">选下方对比卡片看 ClickHouse vs 对手；再看面试题手风琴。</p>

        <h4>生态对比（点击卡片看详情）</h4>
        <div class="engine-compare" id="ecoCards"></div>
        <div class="detail" id="ecoD">点击上方卡片。</div>

        <h4>常见面试题（点击展开/收起）</h4>
        <div id="faqList"></div>
      `
      const ecos = [
        ['Doris / StarRocks', '列式 OLAP 同赛道', '兼容 MySQL、有事务、复杂 JOIN、冷热分离。'],
        ['Trino', '查询引擎', '多数据源联邦。可以把 ClickHouse 当后端查询。'],
        ['TiDB', 'HTAP', '兼顾 OLTP + OLAP。TiKV 行存 + TiFlash 列存。'],
        ['HBase', '列式 KV', '点查快。不是 OLAP，不做聚合分析。'],
        ['Hive', '数仓 SQL 层', 'Metastore 共享。ETL 链路，分钟级延迟。'],
        ['Iceberg', '湖仓表格式', 'ClickHouse 通过 Iceberg Engine 高性能查询。'],
      ]
      const ec = el.querySelector('#ecoCards'), ed = el.querySelector('#ecoD')
      const ecoDetails = {
        'Doris / StarRocks': 'Apache Doris / StarRocks 是 ClickHouse 的直接竞争对手。架构：FE（元数据+调度）+ BE（存储+计算）。优点：<b>原生 MySQL 协议、2PC 事务、复杂 JOIN（CBO 优化）、内置冷热分离</b>。缺点：运维稍复杂（FE/BE 双角色）。适合需要全链路数仓、事务、复杂 JOIN 的场景。',
        'Trino': 'Trino (Presto 分支) 是多数据源联邦查询引擎。ClickHouse 可以作为 Trino 的一个 Connector（<code>connector=clickhouse</code>）。<b>互补关系</b>：Trino 做统一查询入口，ClickHouse 做高性能 ADS 后端查询加速器。Trino 擅长跨数据源 JOIN，ClickHouse 擅长单表大规模聚合。',
        'TiDB': 'PingCAP 的 HTAP 数据库，TiKV（RocksDB 行存 OLTP）+ TiFlash（列存 OLAP）。ClickHouse 是<b>纯 OLAP</b>。如果同一个业务表既要高并发点查（OLTP）又要大规模聚合（OLAP）→ TiDB 更合适。如果纯分析 → ClickHouse 更简单。',
        'HBase': '列式 KV 数据库（LSM-Tree），强依赖 ZooKeeper。适合<b>高并发点查</b>（PK 定位一行）。ClickHouse 不适合点查，但适合聚合分析。两者完全互补：HBase 做在线业务库，ClickHouse 做离线/近线分析。',
        'Hive': '数仓 SQL 层，Metastore + 执行引擎（Tez/Spark/Flink）。ClickHouse 经常用来<b>替换 Hive 的 ADS 报表层</b>，但前面的 ODS/DWD/DWS 清洗链路还是要靠 Hive/Spark。Hive Metastore 可以作为 ClickHouse 的 Catalog（Iceberg Engine 对接）。',
        'Iceberg': 'Apache Iceberg 是湖仓一体表格式。ClickHouse 22.x+ 内置 Iceberg Engine，可以直接查询 S3/HDFS 上的 Iceberg 表（<code>ENGINE = Iceberg(&#39;hdfs://warehouse/orders&#39;)</code>）。Spark/Flink 写 Iceberg → ClickHouse 高性能读同一份数据。',
      }
      ecos.forEach(([n, tag, d]) => {
        const div = document.createElement('div')
        div.className = 'engine-card'
        div.innerHTML = `<h5>${n}</h5><div class="speed">${tag}</div><p style="margin:4px 0 0;font-size:0.78rem;color:var(--muted)">${d}</p>`
        div.onclick = () => {
          ec.querySelectorAll('.engine-card').forEach(x => x.classList.remove('on'))
          div.classList.add('on'); ed.innerHTML = `<b>${n}</b><br>${ecoDetails[n]}`
        }
        ec.appendChild(div)
      })

      const faqs = [
        ['Q1：ClickHouse 为什么那么快？', '三个层面：① <b>列式存储</b> IO 只读需要的列（减 90%+），同类型数据 LZ4 压缩率 10–20x；② <b>SIMD 向量化执行</b> CPU 向量指令一次处理 64–256 行，批量运算比逐行快 5–10x；③ <b>MergeTree 有序合并</b> 数据按 ORDER BY 存储，主索引 Marks 稀疏定位，跳数索引跳过无关 Part。'],
        ['Q2：PARTITION BY 和 ORDER BY 有什么区别？', 'PARTITION BY 决定磁盘目录划分（一级过滤），ORDER BY 决定分区内数据物理顺序和主索引精度。PARTITION BY 通常用时间字段（裁剪 + TTL 过期），ORDER BY 用查询最常过滤的字段（user_id、city）。ORDER BY 必填，PARTITION BY 可选。'],
        ['Q3：分布式写入为什么推荐业务层直连本地表？', 'Distributed 引擎写入多一跳网络跳转 + 单点瓶颈 + 一处失败影响全局。业务层直连本地表：所有节点均衡承载 + 某节点挂了只影响该分片 + 网络路径最短。业务层根据分片键（如 cityHash64(user_id)）哈希路由到对应节点。'],
        ['Q4：UPDATE/DELETE 怎么实现？为什么不推荐？', 'ALERT UPDATE/DELETE 底层是 <b>重写所有 Part</b>（Mutation 机制）。每次需要读取、过滤、重写整个表数据。大量 Mutation 让 Merge 队列爆、查询变慢。替代方案：ReplacingMergeTree + 写入新行、Partition DROP 代替 DELETE、TTL 自动过期。'],
        ['Q5：ClickHouse 和 Hive / Spark SQL 怎么配合？', '典型组合：① <b>Hive on Spark</b> 做 ETL（长链路、多表 JOIN、事务）→ 数据落 Iceberg 到 S3；② <b>ClickHouse</b> 写入清洗后数据做 ADS 层，供实时看板/BI 查询；③ <b>Flink CDC</b> MySQL 实时变更 → Kafka → ClickHouse 物化视图入仓；④ <b>Trino</b> 统一查询入口，后端接 Hive + ClickHouse。'],
        ['Q6：ReplacingMergeTree 去重什么时候生效？FINAL 是什么？', 'ReplacingMergeTree 去重只在 <b>后台 Merge 时</b> 生效。刚 INSERT 的重复数据可能还在。FINAL 关键字强制查询时触发实时合并去重（极慢！大表不可用）。生产应该依赖后台 Merge 自然去重。'],
        ['Q7：跳数索引有哪几种？分别适合什么？', '① <b>minmax</b>：每个 Part 记录列 MIN/MAX → 适合 WHERE amount BETWEEN 范围查询；② <b>set(N)</b>：每个 Part 存 N 个不同值 → 适合 WHERE user_id IN (1,2,3) 等值查询；③ <b>bloom_filter</b>：每个 Part 生成 BF → 适合字符串/低基数字段 city = "北京" 等值查询；④ <b>ngrambf_v1</b>：N-Gram BF → 适合 LIKE "%xxx%" 模糊查询。'],
        ['Q8：高并发写入（每秒 10 万+）怎么设计？', '① <b>AsyncInsert 异步写入</b>：多个微批次自动合并刷盘，减少 Part；② <b>Kafka 引擎 + MV</b>：Kafka 做缓冲，ClickHouse 后台批量消费；③ <b>分布式多节点写入</b>：业务层按分片键路由；④ <b>监控 Part 数</b>：保持单表 < 1000。'],
        ['Q9：分布式查询怎么实现的？', 'Distributed 引擎是代理层。查询时并发把相同 SQL 下发到集群所有分片的本地表 → 每个节点做本地 MergeTree 执行（分区裁剪 + SIMD 聚合）→ 结果返回 Coordinator 节点二次聚合（GROUP BY + 合并）→ 返回用户。'],
        ['Q10：有事务吗？怎么保证一致性？', 'ClickHouse <b>没有完整 ACID 事务</b>。一致性靠：① <b>MergeTree 写入</b> append-only + Merge 最终一致，写入不看到半写数据；② <b>ReplicatedMergeTree + Keeper</b> 副本间异步同步，Keeper 协调 Part 编号避免冲突；③ 写入幂等性（相同批次重试不重复）。需要强事务用 Doris / StarRocks / TiDB。'],
      ]
      const fl = el.querySelector('#faqList')
      faqs.forEach(([q, a]) => {
        const b = document.createElement('button')
        b.className = 'faq-q'; b.textContent = q
        const div = document.createElement('div')
        div.className = 'faq-a hidden'; div.innerHTML = a
        b.onclick = () => {
          div.classList.toggle('hidden')
        }
        fl.appendChild(b); fl.appendChild(div)
      })
    }

    const renders = {
      '01': render01, '02': render02, '03': render03, '04': render04, '05': render05,
      '06': render06, '07': render07, '08': render08, '09': render09, '10': render10,
    }

    // 初始化
    show(current)
  </script>
